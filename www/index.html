  const l=await (await gapi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`)).json();
  let id=l.files&&l.files[0]&&l.files[0].id;
  if(!id){const c=await (await gapi('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:PASTA_DRIVE,mimeType:'application/vnd.google-apps.folder'})})).json();id=c.id;}
  S.drive=Object.assign(S.drive||{},{pasta:id});save();return id;}
function dadosBackup(){const c=JSON.parse(JSON.stringify(S));delete c.seguranca;delete c.drive;return c;}
async function backupDrive(manual){if(!NAT||!S.conta)return;if(!navigator.onLine){if(manual)toast('Sem internet agora — o backup será feito depois');return;}
  try{if(manual)toast('Enviando backup para o Google Drive…');const pasta=await pastaDrive(),d=new Date();
    const nome=`ControlBetico-backup-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}h${pad(d.getMinutes())}.json`;
    const b='cb'+Date.now(),meta={name:nome,parents:[pasta],mimeType:'application/json'};
    const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(dadosBackup())}\r\n--${b}--`;
    await gapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});
    S.drive=Object.assign(S.drive||{},{ultimo:Date.now(),arquivo:nome,erro:null});save();if(manual)toast('✓ Backup salvo no Drive');limpaAntigos(pasta).catch(()=>{});
    if(TAB==='ajustes')render();}
  catch(e){S.drive=Object.assign(S.drive||{},{erro:String(e.message||e).slice(0,120)});if(String(e.message).includes('404'))S.drive.pasta=null;save();
    if(manual)toast('Não consegui salvar no Drive. Tente de novo.');}}
async function listaBackups(){const pasta=await pastaDrive(),q=encodeURIComponent(`'${pasta}' in parents and trashed=false`);
  const l=await (await gapi(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime desc&fields=files(id,name,createdTime,size)&pageSize=100`)).json();return l.files||[];}
async function limpaAntigos(pasta){const f=await listaBackups();for(const x of f.slice(40))await gapi(`https://www.googleapis.com/drive/v3/files/${x.id}`,{method:'DELETE'});}
async function abrirRestaurar(){modal(`<h2>☁️ Restaurar do Google Drive ${xBtn}</h2><div class="empty">Buscando seus backups…</div>`);
  try{const f=await listaBackups();
    modal(`<h2>☁️ Restaurar do Google Drive ${xBtn}</h2>${f.length?`<div class="sm mut">Pasta “${PASTA_DRIVE}” no seu Drive. Escolha qual backup restaurar:</div><div class="list">${f.slice(0,40).map(x=>`<div class="it" style="cursor:pointer" onclick="restauraDrive('${x.id}','${esc(x.createdTime)}')"><div class="grow"><div class="b">${new Date(x.createdTime).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</div><div class="sm mut ell">${esc(x.name)} · ${fmt((x.size||0)/1024,0)} KB</div></div><span class="mut">›</span></div>`).join('')}</div>`:'<div class="empty">Nenhum backup no Drive ainda.</div>'}`);}
  catch(e){modal(`<h2>☁️ Restaurar ${xBtn}</h2><div class="alert warn">Não consegui acessar o Drive agora (${esc(String(e.message||e).slice(0,80))}).</div>`);}}
async function restauraDrive(id,quando){if(!confirm(`Restaurar o backup de ${new Date(quando).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}? Os dados atuais deste celular serão substituídos.`))return;
  try{const d=await (await gapi(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json();if(!d||!Array.isArray(d.registros))throw new Error('arquivo inválido');
    const conta=S.conta,seg=S.seguranca,drv=S.drive;S=migrate(d);S.conta=conta;S.seguranca=seg;S.drive=drv;S.rev=(lerGuardado()||{}).rev||0;save();
    fecha();aplicaTema();atualizaAvatarTopo();go('inicio');toast('✓ Backup restaurado');}
  catch(e){toast('Não consegui restaurar: '+String(e.message||e).slice(0,60));}}
function autoBackup(){if(!NAT||!S.conta||S.backupAuto===false)return;if(Date.now()-((S.drive&&S.drive.ultimo)||0)>20*3600e3)backupDrive(false);}

// ---------- tela de entrada (login) ----------
function telaLogin(){telaCheia('cbLogin',`<div style="max-width:380px">${logoGrande}<h1 style="margin:14px 0 4px;font-size:28px">ControlBético</h1>
  <div style="opacity:.92">Glicemia, carboidratos e insulina — do seu jeito.</div>
  <button id="btnGoogle" style="margin-top:34px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f2937;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700">
  <svg width="22" height="22" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Entrar com Google</button>
  <div id="loginSt" style="margin-top:14px;min-height:22px;font-size:14px;opacity:.95"></div>
  <div style="margin-top:26px;font-size:12.5px;opacity:.8;line-height:1.5">🔒 Seus dados ficam no seu celular. A conta Google é usada para entrar e para guardar os backups numa pasta “${PASTA_DRIVE}” no <b>seu</b> Google Drive.</div></div>`);
  document.getElementById('btnGoogle').onclick=fazerLogin;}
async function fazerLogin(){const st=document.getElementById('loginSt');st.textContent='Abrindo a conta Google…';
  try{const r=await googleLogin(false);if(!r.email)throw new Error('sem e-mail');
    S.conta={email:r.email,nome:r.nome||'',foto:r.foto||'',desde:Date.now()};if(!S.config.nome&&r.nome)S.config.nome=r.nome;save();
    st.textContent='Procurando backups no seu Drive…';
    let ult=null;try{const f=await listaBackups();ult=f[0]||null;}catch(e){}
    fechaTela('cbLogin');atualizaAvatarTopo();render();
    if(ult&&S.registros.length===0){if(confirm(`Encontrei um backup no seu Google Drive de ${new Date(ult.createdTime).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}. Quer restaurar seus dados?`))await restauraDrive2(ult.id);}
    if(!S.seguranca)configurarBloqueio(true);else autoBackup();}
  catch(e){st.innerHTML='Não foi possível entrar. Verifique a internet e tente de novo.<br><small style="opacity:.75">'+esc(String(e&&e.message||e).slice(0,90))+'</small>';}}
async function restauraDrive2(id){try{const d=await (await gapi(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json();const conta=S.conta;S=migrate(d);S.conta=conta;S.rev=(lerGuardado()||{}).rev||0;save();aplicaTema();atualizaAvatarTopo();go('inicio');toast('✓ Dados restaurados do Drive');}catch(e){toast('Não consegui restaurar agora');}}
async function sairConta(){if(!confirm('Sair da conta Google? Seus dados continuam no celular; para entrar de novo será preciso fazer login.'))return;
  try{await glInit();await CBN.SocialLogin.logout({provider:'google'});}catch(e){}S.conta=null;_tok=null;save();telaLogin();}

// ---------- bloqueio (PIN + digital) ----------
async function hashPin(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cb:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function bioDisponivel(){try{const r=await CBN.BiometricAuth.checkBiometry();return !!(r&&(r.isAvailable||r.strongBiometryIsAvailable));}catch(e){return false;}}
function teclado(titulo,sub,onOk,extra=''){let v='';const html=`<div style="max-width:340px;width:100%">${logoGrande.replace('96','64').replace('96','64')}<h2 style="margin:12px 0 2px">${titulo}</h2><div style="opacity:.9;font-size:14px">${sub}</div>
  <div id="pinDots" style="display:flex;gap:14px;justify-content:center;margin:22px 0"></div><div id="pinErr" style="min-height:20px;color:#fecaca;font-size:14px"></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px">${[1,2,3,4,5,6,7,8,9,'bio',0,'del'].map(k=>`<button data-k="${k}" style="height:64px;border-radius:18px;border:0;background:rgba(255,255,255,${k==='bio'||k==='del'?'.06':'.16'});color:#fff;font-size:${k==='bio'?'26':'24'}px;font-weight:700">${k==='del'?'⌫':k==='bio'?(extra.includes('bio')?'👆':''):k}</button>`).join('')}</div>
  ${extra.includes('esqueci')?'<button id="pinEsq" style="margin-top:18px;background:none;border:0;color:#fff;opacity:.85;text-decoration:underline;font-size:14px">Esqueci o PIN</button>':''}</div>`;
  const o=telaCheia('cbPin',html);const dots=()=>{o.querySelector('#pinDots').innerHTML=[0,1,2,3].map(i=>`<span style="width:16px;height:16px;border-radius:50%;background:${i<v.length?'#fff':'rgba(255,255,255,.3)'}"></span>`).join('');};dots();
  o.querySelectorAll('button[data-k]').forEach(b=>b.onclick=async()=>{const k=b.dataset.k;if(k==='del'){v=v.slice(0,-1);dots();return;}if(k==='bio'){if(extra.includes('bio'))desbloqueioBio();return;}
    if(v.length<4){v+=k;dots();if(v.length===4){const ok=await onOk(v);if(!ok){v='';dots();}}}});
  const e=o.querySelector('#pinEsq');if(e)e.onclick=esqueciPin;return o;}
function configurarBloqueio(primeiraVez){teclado('Crie um PIN de 4 números','Ele protege o app quando você abrir.',async p1=>{
  teclado('Confirme o PIN','Digite o mesmo PIN de novo.',async p2=>{if(p1!==p2){document.getElementById('pinErr').textContent='Os PINs não conferem. Comece de novo.';setTimeout(()=>configurarBloqueio(primeiraVez),900);return false;}
    S.seguranca={ativo:true,pin:await hashPin(p1),bio:false,minutos:1};save();fechaTela('cbPin');
    if(await bioDisponivel()&&confirm('Quer usar a digital (ou o desbloqueio do celular) para abrir o app?')){try{await CBN.BiometricAuth.authenticate({reason:'Ativar desbloqueio por digital',cancelTitle:'Cancelar',allowDeviceCredential:true,androidTitle:'ControlBético'});S.seguranca.bio=true;save();toast('Digital ativada ✓');}catch(e){}}
    else toast('PIN criado ✓');if(primeiraVez)autoBackup();if(TAB==='ajustes')render();return true;});return true;});
  if(primeiraVez){const o=document.getElementById('cbPin');const p=document.createElement('button');p.textContent='Agora não';p.style.cssText='margin-top:16px;background:none;border:0;color:#fff;opacity:.85;text-decoration:underline';p.onclick=()=>{S.seguranca={ativo:false};save();fechaTela('cbPin');autoBackup();};o.firstElementChild.appendChild(p);}}
async function bloquear(){if(!NAT||!S.conta||!S.seguranca||!S.seguranca.ativo||_bloqueado)return;_bloqueado=true;
  teclado('ControlBético','Digite seu PIN',async p=>{if(await hashPin(p)===S.seguranca.pin){desbloqueado();return true;}document.getElementById('pinErr').textContent='PIN incorreto';if(navigator.vibrate)navigator.vibrate(120);return false;},(S.seguranca.bio?'bio ':'')+'esqueci');
  if(S.seguranca.bio)setTimeout(desbloqueioBio,350);}
async function desbloqueioBio(){try{await CBN.BiometricAuth.authenticate({reason:'Desbloquear o ControlBético',cancelTitle:'Usar PIN',allowDeviceCredential:true,androidTitle:'ControlBético'});desbloqueado();}catch(e){}}
function desbloqueado(){_bloqueado=false;fechaTela('cbPin');autoBackup();}
async function esqueciPin(){if(!confirm('Para criar um PIN novo, confirme sua conta Google.'))return;try{const r=await googleLogin(false);if(r.email&&S.conta&&r.email.toLowerCase()===S.conta.email.toLowerCase()){_bloqueado=false;fechaTela('cbPin');configurarBloqueio(false);}else toast('Conta diferente da cadastrada');}catch(e){toast('Não foi possível confirmar a conta');}}

// ---------- arquivos (compartilhar no Android) ----------
async function compartilhaArquivo(nome,conteudo,tipo){const F=CBN.Filesystem;let data,enc;
  if(conteudo instanceof Blob){data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(conteudo);});}else{data=conteudo;enc=CBN.Encoding.UTF8;}
  const w=await F.writeFile({path:nome,data,directory:CBN.Directory.Cache,...(enc?{encoding:enc}:{})});
  try{await CBN.Share.share({title:nome,files:[w.uri],dialogTitle:'Enviar / salvar'});}catch(e){if(!/cancel/i.test(String(e&&e.message)))toast('Não consegui compartilhar o arquivo');}}

// ---------- integração com o app ----------
function iniciaNativo(){if(!NAT)return;
  // arquivos: troca downloads por compartilhar
  baixar=(nome,conteudo,tipo)=>compartilhaArquivo(nome,conteudo,tipo);
  exportXLSX=function(){compartilhaArquivo('controlbetico-'+diaKey(Date.now())+'.xlsx',gerarXLSX(HP===1?1:HP));};
  const _relAcao=relAcao;relAcao=function(a){if(a==='ver'){_relAcao(a);setTimeout(()=>{const ov=document.getElementById('relOv');if(ov){const bt=[...ov.querySelectorAll('button')].find(x=>x.textContent.includes('PDF'));if(bt){bt.textContent='↗ Enviar';bt.onclick=()=>relAcao('share');}}},50);return;}const nome=$('#rpNome')?$('#rpNome').value.trim():(S.config.nome||'');if(nome!==(S.config.nome||'')){S.config.nome=nome;save();}
    const o={...(window._relO||{}),dias:RP.dias,nome,tabela:RP.tabela,barra:false};compartilhaArquivo('relatorio-controlbetico-'+diaKey(Date.now())+'.html',gerarRelatorioHTML(o),'text/html');};
  relAcao2=()=>relAcao('share');
  // leitor de rótulo e de código usam arquivos embutidos (funciona sem internet)
  window.OCR_LOCAL=true;
  // botão voltar do Android
  CBN.App.addListener('backButton',()=>{if(document.getElementById('cbPin')||document.getElementById('cbLogin'))return CBN.App.minimizeApp();
    const ov=document.getElementById('relOv')||document.getElementById('emOv');if(ov){ov.remove();return;}
    if($('#mbg').classList.contains('on')){if(typeof pararScan==='function')pararScan();fecha();return;}if(TAB!=='inicio'){go('inicio');return;}CBN.App.minimizeApp();});
  CBN.App.addListener('appStateChange',s=>{if(!s.isActive){_bgDesde=Date.now();return;}
    if(_bgDesde&&Date.now()-_bgDesde>((S.seguranca&&S.seguranca.minutos)||1)*60e3)bloquear();else autoBackup();_bgDesde=0;});
  if(!S.conta)telaLogin();else if(S.seguranca&&S.seguranca.ativo)bloquear();else autoBackup();}

// ---------- seção de Ajustes ----------
function secaoContaHTML(){if(!NAT)return'';const d=S.drive||{},sg=S.seguranca||{};
  return `<details class="card" open><summary>☁️ Conta Google e backup</summary>
   ${S.conta?`<div style="display:flex;align-items:center;gap:10px;margin:10px 0">${S.conta.foto?`<img src="${esc(S.conta.foto)}" style="width:40px;height:40px;border-radius:50%">`:''}<div><div class="b">${esc(S.conta.nome||'')}</div><div class="sm mut">${esc(S.conta.email)}</div></div></div>`:''}
   <div class="calcline"><span>Último backup no Drive</span><b>${d.ultimo?new Date(d.ultimo).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'ainda não'}</b></div>
   ${d.erro?`<div class="sm" style="color:var(--warn)">⚠️ Última tentativa falhou — tentarei de novo.</div>`:''}
   <div class="setrow"><div class="t">Backup automático diário<div class="sm mut">Pasta “${PASTA_DRIVE}” no seu Google Drive</div></div><label class="sw"><input type="checkbox" ${S.backupAuto===false?'':'checked'} onchange="S.backupAuto=this.checked;save()"><span></span></label></div>
   <div class="grid2" style="margin-top:8px"><button class="btn" onclick="backupDrive(true)">☁️ Fazer backup agora</button><button class="btn" onclick="abrirRestaurar()">⤵️ Restaurar do Drive</button></div>
   <button class="btn danger" style="width:100%;margin-top:8px" onclick="sairConta()">Sair da conta</button></details>
  <details class="card"><summary>🔒 Bloqueio do app</summary>
   <div class="setrow"><div class="t">Pedir PIN ao abrir</div><label class="sw"><input type="checkbox" ${sg.ativo?'checked':''} onchange="if(this.checked)configurarBloqueio(false);else{S.seguranca={ativo:false};save();toast('Bloqueio desativado')}"><span></span></label></div>
   ${sg.ativo?`<div class="setrow"><div class="t">Usar digital / desbloqueio do celular</div><label class="sw"><input type="checkbox" ${sg.bio?'checked':''} onchange="ativaBio(this)"><span></span></label></div>
   <div class="setrow"><div class="t">Bloquear depois de</div><select style="width:150px" onchange="S.seguranca.minutos=Number(this.value);save()">${[[0.05,'na hora'],[1,'1 minuto'],[5,'5 minutos'],[15,'15 minutos']].map(([v,t])=>`<option value="${v}" ${sg.minutos==v?'selected':''}>${t}</option>`).join('')}</select></div>
   <button class="btn" style="width:100%;margin-top:6px" onclick="configurarBloqueio(false)">Trocar PIN</button>`:''}</details>`;}
async function ativaBio(el){if(!el.checked){S.seguranca.bio=false;save();return;}if(!(await bioDisponivel())){el.checked=false;toast('Digital não disponível neste celular');return;}
  try{await CBN.BiometricAuth.authenticate({reason:'Ativar desbloqueio por digital',cancelTitle:'Cancelar',allowDeviceCredential:true,androidTitle:'ControlBético'});S.seguranca.bio=true;save();toast('Digital ativada ✓');}catch(e){el.checked=false;}}

// ---------- start ----------
aplicaTema();atualizaAvatarTopo();render();iniciaNativo();
setTimeout(()=>atualizaBase(),4000);
setInterval(()=>{if(TAB==='inicio'&&!$('#mbg').classList.contains('on'))rInicio();},60000);

</script>
