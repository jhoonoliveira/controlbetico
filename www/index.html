<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ControlBético</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22fv%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232563eb%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2306b6d4%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2224%22%20fill%3D%22url%28%23fv%29%22/%3E%3Cg%20transform%3D%22translate%280%2C0%29%20scale%281%29%22%3E%3Cpath%20d%3D%22M71.4%2068%20A28%2028%200%201%201%2071.4%2032%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20transform%3D%22translate%2831%2C30.06%29%20scale%28.38%29%22%20d%3D%22M50%2013%20C50%2013%2024%2043%2024%2061%20A26%2026%200%200%200%2076%2061%20C76%2043%2050%2013%2050%2013Z%22%20fill%3D%22%23fb7185%22/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#0f1115">
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--tx:#e8eaf0;--mut:#9aa1b0;--pri:#3b82f6;--pri2:#2563eb;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--low:#a855f7;--r:14px}
body.claro{--bg:#f3f5f9;--card:#ffffff;--card2:#eef1f6;--line:#dde2ea;--tx:#151821;--mut:#5d6575}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
header h1 .logo{width:30px;height:30px;display:block}header h1 .logo svg{display:block}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
section.tab{display:none}section.tab.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--pri)}
nav button.fab{color:#fff}nav button.fab span.ic{background:var(--pri);border-radius:50%;width:46px;height:46px;display:grid;place-items:center;margin-top:-20px;box-shadow:0 4px 14px rgba(59,130,246,.45)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:700}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 4px}
input,select,textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}
input.big{font-size:30px;font-weight:700;text-align:center;padding:12px}
.btn{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#06240f}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}.btn.full{width:100%}.btn.sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:13px;cursor:pointer;white-space:nowrap;color:var(--tx)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700}
.g-low{color:var(--low)}.g-ok{color:var(--ok)}.g-hi{color:var(--warn)}.g-vhi{color:var(--bad)}
.bg-low{background:rgba(168,85,247,.16);color:var(--low)}.bg-ok{background:rgba(34,197,94,.16);color:var(--ok)}.bg-hi{background:rgba(245,158,11,.16);color:var(--warn)}.bg-vhi{background:rgba(239,68,68,.16);color:var(--bad)}
.hero{display:flex;align-items:center;gap:14px}.hero .val{font-size:44px;font-weight:800;line-height:1}.hero .un{font-size:13px;color:var(--mut)}
.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center}.stat .v{font-size:20px;font-weight:800}.stat .l{font-size:11.5px;color:var(--mut)}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.list .it:last-child{border-bottom:0}
.list .it .grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert{border-radius:12px;padding:12px;margin:10px 0;font-size:14px;border:1px solid}
.alert.bad{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.5)}.alert.warn{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.5)}.alert.info{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.45)}.alert.low{background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.5)}
.result{background:linear-gradient(135deg,rgba(59,130,246,.18),rgba(168,85,247,.14));border:1px solid rgba(59,130,246,.45)}
.result .dose{font-size:54px;font-weight:900;line-height:1;text-align:center}.result .dose small{font-size:18px;font-weight:700}
.calcline{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:8px}.calcline:last-child{border:0}
.food{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.star{background:none;border:0;font-size:20px;cursor:pointer;color:var(--mut);padding:2px 6px}.star.on{color:#facc15}
.x{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;padding:0 6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:22px;cursor:pointer}.stepper input{text-align:center;font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.sw{position:relative;width:46px;height:26px;flex:0 0 46px}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+span{background:var(--pri)}.sw input:checked+span:before{transform:translateX(20px)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.setrow:last-child{border:0}.setrow .t{flex:1}.setrow input,.setrow select{width:110px;text-align:right;padding:8px 10px}
details.card summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}details.card summary::after{content:"▾";color:var(--mut)}details[open].card summary::after{content:"▴"}details.card summary::-webkit-details-marker{display:none}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 10px}
.dayh{font-size:12.5px;color:var(--mut);margin:14px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tagsel{display:flex;flex-wrap:wrap;gap:6px}
svg.chart{width:100%;height:auto;display:block}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
table.rep{width:100%;border-collapse:collapse;font-size:13.5px}table.rep td,table.rep th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}table.rep th:first-child,table.rep td:first-child{text-align:left}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:1px solid #ccc}}
</style>
</head>

  return _FOODS=baseAtiva().itens.map(([id,nome,grupo,c100,fibra,med,un,est])=>{const m=(med&&med.length?med:[['100 g',100]]).map(([mm,g])=>({m:mm,g}));
    return{id,nome,grupo,c100,fibra,medidas:m,medida:m[0].m,gMed:m[0].g,un:un||'g',base:true,est:!!est};});}
function allFoods(){return [...S.alimentos.map(a=>({...a,grupo:'Meus alimentos',medidas:a.medidas||[{m:a.medida,g:a.gMed}]})),...baseFoods()];}
const foodById=id=>allFoods().find(f=>f.id===id);
const carbsDe=(f,g)=>f.c100*g/100;

// ---------- insulina ativa (modelo linear simples) ----------
function insulinaAtiva(ts=Date.now(),excluir=null){let tot=0,ult=null;
  for(const r of S.registros){if(r.id===excluir||r.ts>ts)continue;
    for(const d of (r.doses||[])){const i=ins(d.ins);if(!i||i.tipo!=='bolus')continue;
      const dur=num(i.duracao)||6,el=(ts-r.ts)/H;if(el<dur){tot+=d.ui*(1-el/dur);if(!ult||r.ts>ult.ts)ult={ts:r.ts,ui:d.ui,nome:i.nome};}}}
  return{ui:tot,ult};}

// ---------- cálculo ----------
function arredonda(v){const c=S.config,p=num(c.passo)||1;
  if(c.modoArred==='baixo')return Math.floor(v/p+1e-9)*p;if(c.modoArred==='cima')return Math.ceil(v/p-1e-9)*p;return Math.round(v/p)*p;}
function calcular({glic,carbs,refId,ts,excluir}){
  const c=S.config,p=paramsRef(refId),R={...p,x:0,y:0,yBruto:null,iob:0,iobDesc:0,total:0,arred:0,avisos:[],bloqueado:false};
  if(!(p.ric>0&&p.fs>0&&p.alvo>0)){R.semConfig=true;R.bloqueado=true;R.avisos.push(['warn','<b>Fórmula não configurada.</b> Preencha relação insulina:carboidrato, glicemia alvo e fator de sensibilidade em <b>Ajustes → Fórmula da dose</b> (conforme a sua receita).']);return R;}
  carbs=isNaN(carbs)?0:carbs;
  R.x=carbs>0?carbs/p.ric:0;
  const temG=!isNaN(glic)&&glic>0;
  if(temG){
    if(glic<c.hipo){R.bloqueado=true;
      R.avisos.push(['low',`<b>Glicemia baixa (${fmt(glic,0)} mg/dL).</b> Não aplique insulina agora. Trate a hipoglicemia: ${fmt(c.hipoCarbs,0)} g de carboidrato rápido (ex.: 1 colher de sopa de açúcar em água ou 150 ml de refrigerante comum), meça de novo em 15 min e repita se continuar abaixo de ${fmt(c.hipo,0)}. Depois de normalizar, refaça o cálculo.`]);}
    R.yBruto=(glic-p.alvo)/p.fs;R.y=R.yBruto;
    if(R.y<0&&!c.correcaoNegativa)R.y=0;
    if(num(c.limiarCorrecao)>0&&glic<num(c.limiarCorrecao)&&R.y>0)R.y=0;
    if(glic>=c.altoAlerta)R.avisos.push(['bad',`<b>Glicemia muito alta (${fmt(glic,0)}).</b> Siga a orientação da sua médica para hiperglicemia (ex.: verificar cetonas, hidratar). Se não baixar ou se tiver náusea/vômito, procure atendimento.`]);
  }else R.avisos.push(['info','Sem glicemia informada: o cálculo considera só a comida (X). Meça antes para incluir a correção (Y).']);
  const a=insulinaAtiva(ts||Date.now(),excluir);R.iob=a.ui;
  if(a.ui>=0.1){
    if(c.iobModo==='correcao'&&R.y>0){R.iobDesc=Math.min(R.y,a.ui);R.y-=R.iobDesc;
      R.avisos.push(['info',`Descontei ${fmt(R.iobDesc,1)} UI de insulina rápida ainda ativa (última: ${fmt(a.ult.ui,1)} UI às ${hora(a.ult.ts)}).`]);}
    else if(c.iobModo!=='desligado')R.avisos.push(['warn',`Ainda há ~${fmt(a.ui,1)} UI de ${esc(a.ult.nome)} ativa (aplicada às ${hora(a.ult.ts)}). A fórmula da receita não desconta isso — cuidado com doses seguidas (risco de hipoglicemia).`]);}
  R.total=R.x+R.y;
  if(R.total<0){R.total=0;if(!R.bloqueado)R.avisos.push(['info','A correção negativa (glicemia abaixo do alvo) anulou a dose da comida. Dose sugerida: 0 UI.']);}
  R.arred=Math.max(0,arredonda(R.total));
  if(num(c.doseMax)>0&&R.arred>num(c.doseMax))R.avisos.push(['bad',`Dose acima do seu limite de segurança (${fmt(c.doseMax,1)} UI). Confira os carboidratos e a glicemia digitados.`]);
  if(R.bloqueado){R.arred=0;}
  return R;}

// ---------- estatísticas ----------
function leituras(desde,ate=Date.now()){return S.registros.filter(r=>r.ts>=desde&&r.ts<=ate&&r.glic>0).sort((a,b)=>a.ts-b.ts);}
function stats(desde,ate=Date.now()){const L=leituras(desde,ate),g=L.map(r=>r.glic),n=g.length;
  if(!n)return{n:0};const m=g.reduce((a,b)=>a+b,0)/n,sd=Math.sqrt(g.reduce((a,b)=>a+(b-m)**2,0)/n),c=S.config;
  const cnt=k=>g.filter(x=>classe(x)===k).length;
  return{n,media:m,sd,cv:sd/m*100,gmi:3.31+0.02392*m,min:Math.min(...g),max:Math.max(...g),
    low:cnt('low')/n*100,ok:cnt('ok')/n*100,hi:cnt('hi')/n*100,vhi:cnt('vhi')/n*100,nLow:cnt('low')};}

// ---------- gráfico ----------
function chart(desde,ate=Date.now(),h=200){
  const L=leituras(desde,ate),c=S.config,W=600,P={l:34,r:8,t:10,b:22};
  if(!L.length)return '<div class="empty">Sem medições neste período.</div>';
  const ymax=Math.max(300,...L.map(r=>r.glic+20)),ymin=40;
  const X=t=>P.l+(t-desde)/(ate-desde)*(W-P.l-P.r),Y=g=>P.t+(1-(g-ymin)/(ymax-ymin))*(h-P.t-P.b);
  const cor={low:'var(--low)',ok:'var(--ok)',hi:'var(--warn)',vhi:'var(--bad)'};
  let s=`<svg class="chart" viewBox="0 0 ${W} ${h}">`;
  s+=`<rect x="${P.l}" y="${Y(c.alvoMax)}" width="${W-P.l-P.r}" height="${Y(c.alvoMin)-Y(c.alvoMax)}" fill="rgba(34,197,94,.10)"/>`;
  for(const g of [c.hipo,c.alvoMax,c.altoAlerta]){s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${P.l-4}" y="${Y(g)+4}" font-size="11" fill="var(--mut)" text-anchor="end">${g}</text>`;}
  const span=ate-desde,dias=span/864e5;
  if(dias<=1.01){for(let k=0;k<=24;k+=6){const t=desde+k*H;s+=`<text x="${X(t)}" y="${h-6}" font-size="11" fill="var(--mut)" text-anchor="middle">${hora(t)}</text>`;}}
  else{const step=dias<=8?1:dias<=31?7:15;const d0=new Date(desde);d0.setHours(0,0,0,0);
    for(let t=d0.getTime()+864e5;t<ate;t+=step*864e5){s+=`<line x1="${X(t)}" x2="${X(t)}" y1="${P.t}" y2="${h-P.b}" stroke="var(--line)" stroke-width=".6"/><text x="${X(t)}" y="${h-6}" font-size="11" fill="var(--mut)" text-anchor="middle">${new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</text>`;}}
  if(L.length>1)s+=`<polyline fill="none" stroke="var(--pri)" stroke-opacity=".5" stroke-width="1.6" points="${L.map(r=>X(r.ts).toFixed(1)+','+Y(r.glic).toFixed(1)).join(' ')}"/>`;
  for(const r of L)s+=`<circle cx="${X(r.ts).toFixed(1)}" cy="${Y(Math.min(r.glic,ymax)).toFixed(1)}" r="${L.length>60?2.6:4}" fill="${cor[classe(r.glic)]}"/>`;
  return s+'</svg>';}

// ---------- registro (linha de lista) ----------
function linhaRegistro(r,clicavel=true){
  const ds=(r.doses||[]).map(d=>{const i=ins(d.ins);return `<span class="pill" style="background:${i?i.cor:'#888'}22;color:${i?i.cor:'#888'}">${esc(i?i.nome.split(' ')[0]:'?')} ${fmt(d.ui,1)} UI</span>`;}).join(' ');
  const g=r.glic>0?`<span class="pill bg-${classe(r.glic)}" style="font-size:14px">${fmt(r.glic,0)}</span>`:'<span class="mut sm">—</span>';
  const info=[ref(r.refeicao)?.nome,r.carbs>0?fmt(r.carbs,0)+' g carbo':'',...(r.tags||[])].filter(Boolean).join(' · ');
  return `<div class="it" ${clicavel?`onclick="editarCompleto('${r.id}')" style="cursor:pointer"`:''}>
    <div class="b" style="width:46px">${hora(r.ts)}</div><div style="width:52px">${g}</div>
    <div class="grow"><div class="sm ell">${esc(info)||'<span class=mut>Registro</span>'}</div><div style="margin-top:3px">${ds}</div>${r.nota?`<div class="sm mut ell">📝 ${esc(r.nota)}</div>`:''}</div></div>`;}

function rInicio(){
  const c=S.config,el=$('#tab-inicio'),L=[...S.registros].filter(r=>r.glic>0).sort((a,b)=>b.ts-a.ts),u=L[0],ant=L[1];
  let h='';

      <div style="flex:1"><span class="pill bg-${k}">${classeNome[k]}</span><div class="sm" style="margin-top:6px">${ha(u.ts)} · ${hora(u.ts)} ${ref(u.refeicao)?'· '+esc(ref(u.refeicao).nome):''}</div>${tr}</div></div>`;
    if(k==='low'&&Date.now()-u.ts<45*60000)h+=`<div class="alert low"><b>Hipoglicemia:</b> ${fmt(c.hipoCarbs,0)} g de carboidrato rápido e meça de novo às <b>${hora(u.ts+15*60000)}</b>.</div>`;
  }else h+=`<div class="empty">Nenhuma glicemia registrada ainda.<br>Toque em <b>Medir / comer</b> para começar.</div>`;
  h+=`<div class="grid3" style="margin-top:12px"><button class="btn pri" style="grid-column:span 2;font-size:16px;flex-direction:column;gap:2px" onclick="novaRefeicao()">🩸🍽️ Medir / comer<span class="sm" style="font-weight:500;opacity:.85">calcula a dose na hora</span></button><button class="btn" style="flex-direction:column;gap:2px" onclick="editarRegistro(null,'ins')">💉<span>Só insulina</span></button></div></div>`;
  const a=insulinaAtiva();
  if(a.ui>=0.1)h+=`<div class="alert info">💧 Insulina rápida ainda ativa: <b>~${fmt(a.ui,1)} UI</b> (última ${fmt(a.ult.ui,1)} UI às ${hora(a.ult.ts)}).</div>`;
  h+=alertasEstoque();
  // hoje
  const hoje0=new Date();hoje0.setHours(0,0,0,0);const T=S.registros.filter(r=>r.ts>=hoje0.getTime()).sort((a,b)=>a.ts-b.ts);
  h+=`<div class="card"><h3>Hoje <span class="mut sm">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</span></h3><div class="list">`;
  h+=`<div class="sm mut" style="margin-bottom:4px">Marca sozinho quando você salva uma medição/refeição. Toque numa insulina para marcar ou desmarcar. Errou algo? Toque em ✏️ para corrigir.</div>`;
  for(const r of refsOrd()){const R=T.filter(x=>x.refeicao===r.id);const gl=R.find(x=>x.glic>0);
    const tomadas={};R.forEach(x=>(x.doses||[]).forEach(d=>tomadas[d.ins]=(tomadas[d.ins]||0)+d.ui));
    const cb=R.reduce((a,x)=>a+(x.carbs||0),0);
    const partes=[];let pend=false;
    for(const i of S.insulinas){const k=undoKey(r.id,i.id),fx=i.ativa&&num(i.fixas?.[r.id])>0,ab=i.nome.split(' ')[0];
      if(tomadas[i.id])partes.push(`<button class="chip" onclick="event.stopPropagation();desmarcar('${i.id}','${r.id}')" style="background:${i.cor};border-color:${i.cor};color:#fff">✓ ${esc(ab)} ${fmt(tomadas[i.id],1)}</button>`);
      else if(UNDO[k]){partes.push(`<button class="chip" onclick="event.stopPropagation();marcar('${i.id}','${r.id}')" style="border-color:${i.cor};color:${i.cor};border-style:dashed">${esc(ab)} ${fmt(UNDO[k].ui,1)} · marcar</button>`);if(fx)pend=true;}
      else if(fx){partes.push(`<button class="chip" onclick="event.stopPropagation();marcar('${i.id}','${r.id}')" style="border-color:${i.cor};color:${i.cor};border-style:dashed">${esc(ab)} ${fmt(i.fixas[r.id],1)} · marcar</button>`);pend=true;}}
    if(!R.length&&!partes.length&&!r.medir)continue;
    const ok=R.length&&!pend&&(!r.medir||gl);
    h+=`<div class="it"><div style="width:96px"><div class="b sm">${ok?'<span class="g-ok">✓</span> ':''}${esc(r.nome)}</div><div class="mut sm">${r.inicio}${cb>0?' · 🍽️ '+fmt(cb,0)+' g':''}</div></div>
      <div style="width:56px">${gl?`<button class="pill bg-${classe(gl.glic)}" style="font-size:14px;border:0;cursor:pointer" onclick="editarCompleto('${gl.id}')">${fmt(gl.glic,0)}</button>`:(r.medir?`<button class="chip" style="padding:4px 8px" onclick="novaRefeicao(null,'${r.id}')">medir</button>`:'')}</div>
      <div class="grow" style="display:flex;flex-wrap:wrap;gap:4px">${partes.join('')||'<span class="mut sm">—</span>'}</div>${R.length?`<button class="btn sm" style="flex:0 0 auto;padding:6px 9px" title="Editar" onclick="editarMomento('${r.id}')">✏️</button>`:''}</div>`;}
  if(!S.refeicoes.length)h+=`<div class="sm mut">Cadastre seus momentos do dia (refeições/horários) em <b>Ajustes → Momentos do dia</b> para ver o painel aqui.</div>`;
  const semRef=T.filter(r=>!ref(r.refeicao));if(semRef.length)h+=semRef.map(r=>linhaRegistro(r)).join('');
  h+='</div></div>';
  // 7 dias
  const st=stats(Date.now()-7*864e5);
  h+=`<div class="card"><h3>Últimos 7 dias <button class="btn sm" onclick="go('hist')">Ver mais</button></h3>`;
  if(st.n){h+=`<div class="grid3"><div class="stat"><div class="v">${fmt(st.media,0)}</div><div class="l">média mg/dL</div></div>
    <div class="stat"><div class="v g-ok">${fmt(st.ok,0)}%</div><div class="l">no alvo (${c.alvoMin}–${c.alvoMax})</div></div>
    <div class="stat"><div class="v g-low">${st.nLow}</div><div class="l">hipoglicemias</div></div></div>
    <div style="margin-top:10px">${chart(Date.now()-7*864e5,Date.now(),170)}</div>`;}
  else h+='<div class="empty">Sem medições nos últimos 7 dias.</div>';
  h+='</div><p class="sm mut" style="text-align:center">ControlBético é uma ferramenta de apoio. Siga sempre a orientação médica.</p>';
  el.innerHTML=h;}

const UNDO={};
const undoKey=(refId,insId)=>diaKey(Date.now())+'|'+refId+'|'+insId;
function estDose(d,sinal){const i=ins(d.ins);if(i&&i.estoque!==null&&i.estoque!==''&&!isNaN(num(i.estoque)))i.estoque=Math.max(0,num(i.estoque)-sinal*d.ui);}
const vazio=r=>!(r.glic>0)&&!(r.carbs>0)&&!(r.doses||[]).length&&!r.nota&&!(r.tags||[]).length;
function hojeRef(refId){const h0=new Date();h0.setHours(0,0,0,0);return S.registros.filter(r=>r.ts>=h0.getTime()&&r.ts<h0.getTime()+864e5&&r.refeicao===refId);}
function desmarcar(insId,refId){const k=undoKey(refId,insId),u={ui:0,itens:[]};
  for(const r of hojeRef(refId)){const ds=(r.doses||[]).filter(d=>d.ins===insId);if(!ds.length)continue;
    r.doses=r.doses.filter(d=>d.ins!==insId);ds.forEach(d=>{estDose(d,-1);u.ui+=d.ui;});
    const apagado=vazio(r);if(apagado)S.registros=S.registros.filter(x=>x.id!==r.id);
    u.itens.push({id:r.id,doses:ds,copia:apagado?JSON.parse(JSON.stringify(r)):null});}
  UNDO[k]=u;save();toast('Desmarcado — toque de novo para marcar');render();}
function marcar(insId,refId){const k=undoKey(refId,insId),u=UNDO[k],i=ins(insId);
  if(u){for(const it of u.itens){let r=S.registros.find(x=>x.id===it.id);
      if(!r&&it.copia){r=it.copia;S.registros.push(r);}
      if(!r){r={id:uid(),ts:Date.now(),refeicao:refId,glic:null,carbs:null,itens:[],doses:[],nota:'',tags:[]};S.registros.push(r);}
      r.doses.push(...it.doses);it.doses.forEach(d=>estDose(d,1));}
    delete UNDO[k];}
  else{const ui=num(i.fixas?.[refId]);if(!(ui>0))return;
    const r={id:uid(),ts:Date.now(),refeicao:refId,glic:null,carbs:null,itens:[],doses:[{ins:insId,ui,motivo:'fixa'}],nota:'',tags:[]};
    S.registros.push(r);estDose(r.doses[0],1);}
  save();toast(`✓ ${i.nome} marcada`);render();}
function baixaEstoque(r,sinal){ // sinal 1 = consome, -1 = devolve
  if(r.glic>0&&S.fitas!==null&&S.fitas!==undefined&&S.fitas!=='')S.fitas=Math.max(0,num(S.fitas)-sinal);
  for(const d of r.doses||[]){const i=ins(d.ins);if(i&&i.estoque!==null&&i.estoque!==''&&!isNaN(num(i.estoque)))i.estoque=Math.max(0,num(i.estoque)-sinal*d.ui);}}
function alertasEstoque(){let h='';const f=num(S.fitas);
  if(!isNaN(f)&&S.fitas!==null&&S.fitas!==''&&f<=15)h+=`<div class="alert warn">🧪 Restam <b>${fmt(f,0)}</b> fitas de glicemia.</div>`;
  for(const i of S.insulinas){const e=num(i.estoque);if(i.ativa&&!isNaN(e)&&i.estoque!==null&&i.estoque!==''&&e<=100)h+=`<div class="alert warn">💉 ${esc(i.nome)}: restam ~<b>${fmt(e,0)} UI</b> no frasco.</div>`;
    if(i.ativa&&i.abertoEm){const dias=Math.floor((Date.now()-new Date(i.abertoEm+'T00:00').getTime())/864e5),v=num(i.validadeDias)||28;
      if(dias>=v-3)h+=`<div class="alert ${dias>=v?'bad':'warn'}">📅 ${esc(i.nome)}: frasco aberto há <b>${dias} dias</b> (validade após aberto: ${v} dias).</div>`;}}
  return h;}

// ===================== REFEIÇÃO / CALCULADORA =====================
let D=null;
function novoDraft(){const ts=Date.now();return{ts,refeicao:refeicaoDe(ts),glic:'',itens:[],extra:'',doses:{},on:{},editados:{},nota:'',tags:[]};}
const itC=it=>it.c100*it.gMed*it.q/100;
const itTxt=it=>`${fmt(it.q,2)} × ${it.medida} (${fmt(it.gMed*it.q)} ${it.un})`;
function normItem(i){if(i.gMed)return{...i};return{nome:i.nome,gMed:i.g||1,c100:i.g?i.carbs/i.g*100:0,un:'g',medida:i.txt||'porção',q:1};}
const carbsD=()=>D.itens.reduce((a,i)=>a+itC(i),0)+(num(D.extra)||0);
const bolusCalc=()=>S.insulinas.find(i=>i.ativa&&i.tipo==='bolus');
function addFood(fid,q=1){const f=foodById(fid);const ex=D.itens.find(i=>i.fid===fid);
  if(ex)ex.q+=q;else D.itens.push({fid:f.id,nome:f.nome,gMed:f.gMed,c100:f.c100,un:f.un,medida:f.medida,q});
  const s=$('#cBusca');if(s){s.value='';$('#cRes2').innerHTML='';}updCalc();toast(f.nome+' adicionado');}
function editItem(k){const it=D.itens[k];modal(`<h2>${esc(it.nome)} ${xBtn}</h2>
  <label>Quantidade de "${esc(it.medida)}" (${fmt(it.gMed)} ${it.un} cada)</label><input id="eiQ" inputmode="decimal" value="${fmt(it.q,2)}" oninput="$('#eiG').value=fmt((num(this.value)||0)*${it.gMed},1);eiUpd()">
  <label>ou o peso exato (${it.un})</label><input id="eiG" inputmode="decimal" value="${fmt(it.q*it.gMed,1)}" oninput="$('#eiQ').value=fmt((num(this.value)||0)/${it.gMed},2);eiUpd()">
  <div class="card result" style="margin-top:12px;text-align:center"><div class="sm mut">Carboidratos</div><div class="dose" id="eiC" style="font-size:40px"></div></div>
  <div class="row"><button class="btn danger" onclick="D.itens.splice(${k},1);fecha();updCalc()">Remover</button><button class="btn pri" style="flex:2" onclick="const g=num($('#eiG').value);if(!(g>0)){toast('Informe a quantidade');return;}D.itens[${k}].q=g/${it.gMed};fecha();updCalc()">OK</button></div>`);
  window.eiUpd=()=>{$('#eiC').innerHTML=fmt((num($('#eiG').value)||0)*it.c100/100,1)+' <small>g</small>';};eiUpd();}
function qStep(k,d){const it=D.itens[k];const st=d>0?(it.q<1?0.5:1):(it.q<=1?0.5:1);it.q=Math.max(0.5,Math.round((it.q+(d>0?st:-st))*100)/100);updCalc();}
function buscaInline(q){const el=$('#cRes2');if(!norm(q).trim()){el.innerHTML='';return;}
  const L=filtraFoods(q,'').slice(0,7);
  el.innerHTML=(L.map(f=>`<div class="food" onclick="addFood('${f.id}')"><div style="flex:1;min-width:0"><div class="ell">${S.favoritos.includes(f.id)?'★ ':''}${esc(f.nome)}</div><div class="sm mut">1 ${esc(f.medida)} ≈ <b>${fmt(carbsDe(f,f.gMed),1)} g</b> carbo</div></div><span class="pill bg-ok">+ 1</span></div>`).join('')||'<div class="sm mut" style="padding:8px 0">Não encontrado na tabela.</div>')
   +`<button class="btn sm" style="margin-top:6px" onclick="novoAlimento(true)">+ Cadastrar “${esc(q)}” pelo rótulo</button>`;}
function novaRefeicao(foco,refId){D=novoDraft();if(refId)D.refeicao=refId;go('calc');setTimeout(()=>{const t=foco==='food'?$('#cBusca'):$('#cGlic');if(t)t.focus();},120);}

function rCalc(){if(!D)D=novoDraft();D.itens=D.itens.map(normItem);const el=$('#tab-calc');
  el.innerHTML=`
  <div id="cBar" style="position:sticky;top:57px;z-index:4;margin:-14px -14px 12px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)"></div>
  ${D.editId?`<div class="alert warn" style="margin-top:0">✏️ <b>Corrigindo registro de ${diaNome(D.ts)} às ${hora(D.ts)}.</b> Mude o que precisar (glicemia, alimentos, gramas, doses) e toque em <b>Salvar correção</b>.</div>`:''}
  <div class="card" style="padding:10px 14px"><div class="row"><span class="sm mut" style="flex:0 0 auto">Lançar em</span><select id="cRef" style="padding:8px" onchange="D.refeicao=this.value;updCalc()">${refsOrd().map(r=>`<option value="${r.id}" ${r.id===D.refeicao?'selected':''}>${esc(r.nome)}</option>`).join('')}<option value="" ${!D.refeicao?'selected':''}>Outro</option></select></div></div>
  <div class="card"><h3>🩸 Glicemia agora <span class="mut sm">mg/dL</span></h3>
    <input class="big" id="cGlic" inputmode="numeric" placeholder="ex.: 180" value="${esc(D.glic)}" oninput="D.glic=this.value;updCalc()">
    <div class="sm mut" style="margin-top:6px;text-align:center">Deixe em branco se não mediu</div></div>
  <div class="card"><h3>🥗 O que vou comer <span id="cTot" class="pill bg-ok" style="font-size:14px"></span></h3>
    <div class="row" style="gap:8px"><input id="cBusca" style="flex:1" placeholder="🔍 Digite o alimento (ex.: pera, arroz, pão)" oninput="buscaInline(this.value)" autocomplete="off"><button class="btn" style="flex:0 0 auto" title="Ler rótulo" onclick="fotoRotulo()">📷</button><button class="btn" style="flex:0 0 auto" title="Código de barras" onclick="lerCodigo()">🏷️</button></div>
    <div id="cRes2"></div>
    <div class="list" id="cItens" style="margin-top:6px"></div>
    <div class="grid2" style="margin-top:8px"><button class="btn sm" onclick="abrirSeletor()">📋 Lista completa</button><button class="btn sm" onclick="abrirPratos()">⭐ Prato salvo</button></div>
    <label>Ou digite o total de carboidratos (g) — soma com os alimentos acima</label><input id="cExtra" inputmode="decimal" placeholder="0" value="${esc(D.extra)}" oninput="D.extra=this.value;updCalc()"></div>
  <div class="card result" id="cRes"></div>
  <div class="card"><h3>💉 Doses que vou registrar</h3><div id="cDoses"></div></div>
  <div class="card"><h3>Data e observações</h3>
    <div><div><label>Data e hora</label><input type="datetime-local" value="${toLocalInput(D.ts)}" onchange="D.ts=fromLocalInput(this.value);updCalc()"></div></div>
    <div class="tagsel" style="margin-top:10px">${TAGS.map(t=>`<button class="chip ${D.tags.includes(t)?'on':''}" onclick="togTag('${t}',this)">${t}</button>`).join('')}</div>
    <textarea id="cNota" rows="2" style="margin-top:8px" placeholder="Anotação (opcional)" oninput="D.nota=this.value">${esc(D.nota)}</textarea></div>
  ${D.editId?`<div class="row"><button class="btn danger" onclick="excluirEdicao()">Excluir</button><button class="btn" onclick="cancelarEdicao()">Cancelar</button><button class="btn pri" style="flex:2" onclick="salvarCalc()">✓ Salvar correção</button></div>`
  :`<div class="row"><button class="btn" onclick="if(confirm('Limpar tudo?')){D=novoDraft();rCalc();}">Limpar</button><button class="btn pri" style="flex:2" onclick="salvarCalc()">✓ Salvar registro</button></div>`}`;
  updCalc();}
function togTag(t,b){const i=D.tags.indexOf(t);i<0?D.tags.push(t):D.tags.splice(i,1);b.classList.toggle('on');}

function updCalc(){const carbs=carbsD(),glic=num(D.glic);const R=calcular({glic,carbs,refId:D.refeicao,ts:D.ts,excluir:D.editId});D._R=R;
  if(D.editId){const ch=carbs.toFixed(2)+'|'+D.glic+'|'+D.refeicao;if(D.chave0===null)D.chave0=ch;
    const bi0=bolusCalc();if(bi0&&D.autoBolus&&ch!==D.chave0&&!R.bloqueado){D.doses[bi0.id]=fmt(R.arred,1);D.on[bi0.id]=R.arred>0;}}const c=S.config;
  $('#cTot').textContent=fmt(carbs,1)+' g';
  $('#cItens').innerHTML=D.itens.length?D.itens.map((it,k)=>`<div class="it"><div class="grow" style="cursor:pointer" onclick="editItem(${k})"><div class="ell b">${esc(it.nome)} <span class="mut sm">✏️</span></div><div class="sm mut">${esc(itTxt(it))} · <b>${fmt(itC(it),1)} g carbo</b></div></div>
    <div class="stepper" style="gap:4px"><button style="width:36px;height:36px;font-size:18px" onclick="qStep(${k},-0.5)">−</button><b style="min-width:30px;text-align:center">${fmt(it.q,2)}</b><button style="width:36px;height:36px;font-size:18px" onclick="qStep(${k},0.5)">+</button></div>
    <button class="x" onclick="D.itens.splice(${k},1);updCalc()">✕</button></div>`).join('')+`<button class="btn sm" style="margin-top:8px" onclick="salvarPrato()">⭐ Salvar estes itens como prato</button>`:'';
  const bi=bolusCalc();
  $('#cBar').innerHTML=R.semConfig?`<div class="sm">⚠️ Fórmula não configurada — <a href="#" onclick="go('ajustes');return false" style="color:var(--pri)">configurar</a></div>`
   :R.bloqueado?`<div class="b g-low">⚠️ Glicemia baixa — não aplicar insulina agora</div>`
   :(isNaN(glic)&&!carbs)?`<div class="sm mut">Digite a glicemia e/ou os alimentos — a dose aparece aqui na hora.</div>`
   :`<div class="row" style="justify-content:space-between"><div class="sm" style="flex:2">Aplicar de <b>${esc(bi?bi.nome:'insulina rápida')}</b><div class="mut">${fmt(carbs,1)} g carbo${isNaN(glic)?'':' · glicemia '+fmt(glic,0)}</div></div><div style="flex:1;text-align:right;font-size:30px;font-weight:900;color:var(--pri)">${fmt(R.arred,1)}<small style="font-size:14px"> UI</small></div></div>`;
  let h='';
  if(R.semConfig){h=`<div class="dose mut">— <small>UI</small></div><div style="text-align:center;margin-top:8px"><button class="btn pri" onclick="go('ajustes')">Configurar fórmula</button></div>`;}
  else if(R.bloqueado){h=`<div class="dose g-low">0 <small>UI</small></div>`;}
  else{h=`<div class="sm mut" style="text-align:center">Dose sugerida de ${esc(bi?bi.nome:'insulina rápida')}</div><div class="dose">${fmt(R.arred,1)} <small>UI</small></div>
    ${Math.abs(R.arred-R.total)>0.001?`<div class="sm mut" style="text-align:center">cálculo exato: ${fmtF(R.total,2)} UI · arredondado ${c.modoArred==='baixo'?'para baixo':c.modoArred==='cima'?'para cima':'ao mais próximo'} (passo ${fmt(c.passo,1)})</div>`:''}`;}
  h+=`<div style="margin-top:10px">
    <div class="calcline"><span>X · comida: ${fmt(carbs,1)} g ÷ ${fmt(R.ric)}</span><b>${fmtF(R.x,2)} UI</b></div>
    <div class="calcline"><span>Y · correção: ${isNaN(glic)?'sem glicemia':`(${fmt(glic,0)} − ${fmt(R.alvo)}) ÷ ${fmt(R.fs)}`}</span><b>${R.yBruto===null?'0,00':fmtF(R.yBruto,2)} UI</b></div>
    ${R.yBruto!==null&&R.yBruto<0&&!c.correcaoNegativa?`<div class="calcline"><span class="mut">correção negativa desativada</span><b>→ 0</b></div>`:''}
    ${R.iobDesc>0?`<div class="calcline"><span>− insulina ainda ativa</span><b>−${fmtF(R.iobDesc,2)} UI</b></div>`:''}
    <div class="calcline"><span class="b">X + Y</span><b>${fmtF(R.total,2)} UI</b></div></div>`;
  if(!R.bloqueado&&R.arred>0&&num(c.antecedencia)>0){const ap=D.ts,co=D.ts+num(c.antecedencia)*60000;
    h+=`<div class="alert info" style="text-align:center">Aplicar às <b>${hora(ap)}</b> → comer a partir das <b>${hora(co)}</b> (${fmt(c.antecedencia,0)} min antes)</div>`;}
  if(D.editId&&bi&&!R.bloqueado)h+=`<div style="text-align:center;margin-top:8px"><button class="btn sm" onclick="usarSugestao()">Usar ${fmt(R.arred,1)} UI nas doses abaixo</button></div>`;
  h+=R.avisos.map(([k,t])=>`<div class="alert ${k}">${t}</div>`).join('');
  $('#cRes').innerHTML=h;
  // doses
  let d='';
  for(const i of S.insulinas.filter(i=>i.ativa)){let sug='',tipo='';
    if(i===bi){sug=R.bloqueado?0:R.arred;tipo='calculada';}
    else if(i.tipo==='basal'&&num(i.fixas?.[D.refeicao])>0){sug=num(i.fixas[D.refeicao]);tipo='dose fixa deste horário';
      const hoje0=new Date(D.ts);hoje0.setHours(0,0,0,0);
      const ja=S.registros.some(r=>r.id!==D.editId&&r.ts>=hoje0.getTime()&&r.ts<hoje0.getTime()+864e5&&r.refeicao===D.refeicao&&(r.doses||[]).some(x=>x.ins===i.id));
      if(ja)tipo='já registrada hoje neste horário';if(ja&&D.on[i.id]===undefined)D.on[i.id]=false;}
    if(!D.editados[i.id])D.doses[i.id]=sug===''?'':String(sug).replace('.',',');
    if(D.on[i.id]===undefined||(!D.editados[i.id]&&i===bi))D.on[i.id]=num(D.doses[i.id])>0&&!(i===bi&&R.bloqueado);
    d+=`<div class="setrow"><label class="sw"><input type="checkbox" ${D.on[i.id]?'checked':''} onchange="D.on['${i.id}']=this.checked;D.editados['${i.id}']=true"><span></span></label>
      <div class="t"><div class="b"><span class="dot" style="background:${i.cor}"></span> ${esc(i.nome)}</div><div class="sm mut">${tipo||'manual'}</div></div>
      <input inputmode="decimal" value="${esc(D.doses[i.id])}" placeholder="UI" oninput="D.doses['${i.id}']=this.value;D.editados['${i.id}']=true;if(D.editId){D.autoBolus=false;}const cb=this.parentNode.querySelector('input[type=checkbox]');cb.checked=num(this.value)>0;D.on['${i.id}']=cb.checked"></div>`;}
  d+='<div class="sm mut" style="margin-top:6px">Ligue só o que você realmente aplicou (ou vai aplicar). Você pode mudar o valor.</div>';
  $('#cDoses').innerHTML=d;}

function salvarCalc(){const R=D._R,carbs=carbsD(),glic=num(D.glic);
  const doses=S.insulinas.filter(i=>D.on[i.id]&&num(D.doses[i.id])>0).map(i=>({ins:i.id,ui:num(D.doses[i.id]),motivo:i===bolusCalc()?'refeicao':(i.tipo==='basal'?'fixa':'extra')}));
  if(isNaN(glic)&&!carbs&&!doses.length&&!D.nota){toast('Nada para salvar');return;}
  if(!isNaN(glic)&&(glic<20||glic>700)){if(!confirm('Glicemia '+glic+' mg/dL parece fora do normal. Salvar mesmo assim?'))return;}
  const dados={ts:D.ts,refeicao:D.refeicao,glic:isNaN(glic)?null:glic,carbs:carbs||null,itens:D.itens.map(i=>({...i,g:i.gMed*i.q,carbs:itC(i),txt:itTxt(i)})),doses,
    calc:{x:R.x,y:R.y,iob:R.iob,total:R.total,arred:R.arred,ric:R.ric,fs:R.fs,alvo:R.alvo},nota:D.nota,tags:D.tags};
  const old=D.editId&&S.registros.find(x=>x.id===D.editId);
  if(old){baixaEstoque(old,-1);Object.assign(old,dados);baixaEstoque(old,1);}else{const r={id:uid(),...dados};S.registros.push(r);baixaEstoque(r,1);}
  const volta=D.volta||'inicio';save();D=null;toast(old?'Registro corrigido ✓':'Registro salvo ✓');go(volta);}
function editarCompleto(id){const r=S.registros.find(x=>x.id===id);if(!r)return;fecha();
  const itens=(r.itens||[]).map(normItem),soma=itens.reduce((a,i)=>a+itC(i),0),extra=(r.carbs||0)-soma;
  D={editId:id,volta:TAB==='hist'?'hist':'inicio',ts:r.ts,refeicao:r.refeicao||'',glic:r.glic>0?String(r.glic):'',itens,extra:extra>0.05?fmt(extra,1):'',doses:{},on:{},editados:{},nota:r.nota||'',tags:[...(r.tags||[])]};
  for(const i of S.insulinas){const s=(r.doses||[]).filter(d=>d.ins===i.id).reduce((a,d)=>a+d.ui,0);D.editados[i.id]=true;D.doses[i.id]=s?fmt(s,2):'';D.on[i.id]=s>0;}
  const bi=bolusCalc();D.registrado=bi?((r.doses||[]).filter(d=>d.ins===bi.id).reduce((a,d)=>a+d.ui,0)):0;D.autoBolus=true;D.chave0=null;
  go('calc');}
function editarMomento(refId){const h0=new Date();h0.setHours(0,0,0,0);const L=S.registros.filter(r=>r.ts>=h0.getTime()&&r.refeicao===refId).sort((a,b)=>a.ts-b.ts);
  if(L.length===1)return editarCompleto(L[0].id);
  modal(`<h2>Qual registro corrigir? ${xBtn}</h2><div class="sm mut">${esc(ref(refId)?.nome||'')} de hoje tem ${L.length} registros:</div><div class="list">${L.map(r=>linhaRegistro(r)).join('')}</div>`);}
function cancelarEdicao(){const v=D.volta||'inicio';D=null;go(v);}
function excluirEdicao(){if(!confirm('Excluir este registro inteiro?'))return;const r=S.registros.find(x=>x.id===D.editId);if(r){baixaEstoque(r,-1);S.registros=S.registros.filter(x=>x.id!==r.id);}
  const v=D.volta||'inicio';save();D=null;toast('Registro excluído');go(v);}
function usarSugestao(){const bi=bolusCalc();if(!bi||!D._R)return;D.autoBolus=false;D.doses[bi.id]=fmt(D._R.arred,1).replace('.',',');D.on[bi.id]=D._R.arred>0;D.editados[bi.id]=true;updCalc();}

// ---------- seletor de alimentos ----------
let SQ='',SG='';
function abrirSeletor(){SQ='';SG='';modal(`<h2>Adicionar alimento ${xBtn}</h2>
  <input id="sBusca" placeholder="Buscar (ex.: arroz, pão, banana)" oninput="SQ=this.value;listaSel()">
  <div class="chips" style="margin:8px 0">${['','★','Meus alimentos',...new Set(baseFoods().map(f=>f.grupo))].map(g=>`<button class="chip ${g===SG?'on':''}" onclick="SG='${g}';$$('#modal .chips .chip').forEach(c=>c.classList.remove('on'));this.classList.add('on');listaSel()">${g===''?'Todos':g==='★'?'★ Favoritos':g}</button>`).join('')}</div>
  <div id="sLista"></div>
  <button class="btn full" style="margin-top:10px" onclick="novoAlimento(true)">+ Cadastrar alimento novo</button>`);listaSel();}
function filtraFoods(q,g){const n=norm(q).split(/\s+/).filter(Boolean);
  let L=allFoods().filter(f=>(!g||(g==='★'?S.favoritos.includes(f.id):f.grupo===g))&&n.every(w=>norm(f.nome).includes(w)));
  const q0=n[0]||'',sc=f=>{if(!q0)return 0;const t=norm(f.nome);return t.startsWith(q0)?0:t.split(/[\s\/(]+/).some(w=>w.startsWith(q0))?1:2;};
  const qn=norm(q),pen=f=>(S.favoritos.includes(f.id)?-1:0)+(f.grupo==='Meus alimentos'?-0.5:0)+(f.medida==='100 g'?0.4:0)+(/\bcru[as]?\b|\bpo\b|\bpó\b|mistura para/.test(norm(f.nome))&&!/cru|po\b/.test(qn)?0.6:0);
  return L.sort((a,b)=>(sc(a)-sc(b))||(pen(a)-pen(b))||a.nome.localeCompare(b.nome));}
function listaSel(){const L=filtraFoods(SQ,SG).slice(0,120);
  $('#sLista').innerHTML=L.length?L.map(f=>`<div class="food" onclick="qtdModal('${f.id}')"><div class="grow" style="flex:1;min-width:0"><div class="ell">${S.favoritos.includes(f.id)?'★ ':''}${esc(f.nome)}</div><div class="sm mut">1 ${esc(f.medida)} (${fmt(f.gMed)} ${f.un}) ≈ <b>${fmt(carbsDe(f,f.gMed),1)} g</b> carbo</div></div><span class="mut">›</span></div>`).join(''):'<div class="empty">Nada encontrado. Cadastre o alimento abaixo.</div>';}
let QM={};
function qtdModal(fid){const f0=foodById(fid);const f={...f0};QM={f,modo:'medida',q:1,g:f.gMed};
  modal(`<h2>${esc(f.nome)} ${xBtn}</h2>
  ${f.medidas&&f.medidas.length>1?`<label>Medida</label><div class="chips" id="qmMeds" style="flex-wrap:wrap">${f.medidas.map((m,i)=>`<button class="chip ${i?'':'on'}" onclick="QM.f.medida=${JSON.stringify(m.m).replace(/"/g,'&quot;')};QM.f.gMed=${m.g};$$('#qmMeds .chip').forEach(c=>c.classList.remove('on'));this.classList.add('on');QM.modo='medida';qmUpd(true)">${esc(m.m)} · ${fmt(m.g)} g</button>`).join('')}</div><div style="height:8px"></div>`:''}
  <div class="chips"><button class="chip on" id="qmM" onclick="QM.modo='medida';qmUpd(true)">Medida caseira</button><button class="chip" id="qmG" onclick="QM.modo='g';qmUpd(true)">Em ${f.un==='ml'?'ml':'gramas'}</button></div>
  <div id="qmBody" style="margin-top:12px"></div>
  <div class="card result" style="margin-top:12px;text-align:center"><div class="sm mut">Carboidratos</div><div class="dose" id="qmC" style="font-size:40px"></div></div>
  <div class="row"><button class="btn" onclick="abrirSeletor()">‹ Voltar</button><button class="btn pri" style="flex:2" onclick="qmAdd()">Adicionar</button></div>
  <div class="sm mut" style="margin-top:8px">${f.base?(f.est?'Valor estimado (preparações variam). Para produtos industrializados, prefira o rótulo.':'Fonte: TACO/UNICAMP'+(f.medidas&&f.medidas.length&&f.medida!=='100 g'?' · medidas caseiras: IBGE/POF':'')+(f.fibra!=null?' · fibras: '+fmt(f.fibra*(QM.gt||f.gMed)/100,1)+' g':'')):(f.codigo?'Seu alimento (código '+esc(f.codigo)+').':'Seu alimento cadastrado.')}</div>`);qmUpd(true);}
function qmUpd(full){const f=QM.f;
  if(full){$('#qmM').classList.toggle('on',QM.modo==='medida');$('#qmG').classList.toggle('on',QM.modo==='g');
    $('#qmBody').innerHTML=QM.modo==='medida'?`<label>Quantidade de "${esc(f.medida)}" (${fmt(f.gMed)} ${f.un} cada)</label><div class="stepper"><button onclick="QM.q=Math.max(0.5,(num(QM.q)||0)-0.5);$('#qmQ').value=fmt(QM.q,2);qmUpd()">−</button><input id="qmQ" inputmode="decimal" value="${fmt(QM.q,2)}" oninput="QM.q=num(this.value);qmUpd()"><button onclick="QM.q=(num(QM.q)||0)+0.5;$('#qmQ').value=fmt(QM.q,2);qmUpd()">+</button></div>`
    :`<label>Quantidade (${f.un})</label><input id="qmGi" inputmode="decimal" value="${fmt(QM.g,1)}" oninput="QM.g=num(this.value);qmUpd()">`;}
  const g=QM.modo==='medida'?(num(QM.q)||0)*f.gMed:(num(QM.g)||0);QM.gt=g;$('#qmC').innerHTML=fmt(carbsDe(f,g),1)+' <small>g</small>';}
function qmAdd(){const f=QM.f,g=QM.gt||0;if(!g){toast('Informe a quantidade');return;}
  const txt=QM.modo==='medida'?`${fmt(QM.q,2)} × ${f.medida} (${fmt(g)} ${f.un})`:`${fmt(g)} ${f.un}`;
  D.itens.push({fid:f.id,nome:f.nome,gMed:f.gMed,c100:f.c100,un:f.un,medida:f.medida,q:g/f.gMed});fecha();rCalc();}
function abrirPratos(){modal(`<h2>Pratos salvos ${xBtn}</h2>${S.pratos.length?`<div class="list">${S.pratos.map(p=>`<div class="it" style="cursor:pointer" onclick="addPrato('${p.id}')"><div class="grow"><div class="b">${esc(p.nome)}</div><div class="sm mut ell">${esc(p.itens.map(i=>i.nome).join(', '))}</div></div><b>${fmt(p.itens.reduce((a,i)=>a+(i.gMed?itC(i):i.carbs),0),1)} g</b></div>`).join('')}</div>`:'<div class="empty">Nenhum prato salvo ainda.<br>Monte uma refeição e toque em “Salvar estes itens como prato”.</div>'}`);}
function addPrato(id){const p=S.pratos.find(x=>x.id===id);D.itens.push(...p.itens.map(normItem));fecha();rCalc();}
function salvarPrato(){const n=prompt('Nome do prato (ex.: Meu café da manhã):');if(!n)return;S.pratos.push({id:uid(),nome:n,itens:D.itens.map(i=>({...i,carbs:itC(i)}))});save();toast('Prato salvo ⭐');}

// ===================== REGISTRO MANUAL / EDIÇÃO =====================
function editarRegistro(id,modo){const r=id?S.registros.find(x=>x.id===id):{id:null,ts:Date.now(),refeicao:refeicaoDe(Date.now()),glic:null,carbs:null,doses:[],nota:'',tags:[]};
  const dv=k=>{const d=(r.doses||[]).find(x=>x.ins===k);return d?fmt(d.ui,2):'';};
  modal(`<h2>${id?'Editar registro':'Registrar insulina'} ${xBtn}</h2>
  <div><div><label>Data e hora</label><input type="datetime-local" id="eTs" value="${toLocalInput(r.ts)}"></div>
  <div><label>Momento</label><select id="eRef">${refsOrd().map(x=>`<option value="${x.id}" ${x.id===r.refeicao?'selected':''}>${esc(x.nome)}</option>`).join('')}<option value="" ${!r.refeicao?'selected':''}>Outro</option></select></div></div>
  <label>Glicemia (mg/dL)</label><input id="eG" class="big" inputmode="numeric" value="${r.glic>0?r.glic:''}" placeholder="—" oninput="sugEdit()">
  <label>Carboidratos ingeridos (g)</label><input id="eC" inputmode="decimal" value="${r.carbs>0?fmt(r.carbs,1):''}" placeholder="—" oninput="sugEdit()">
  <div id="eSug" class="alert info" style="display:none"></div>
  ${(r.itens||[]).length?`<div class="sm mut" style="margin-top:4px">${esc(r.itens.map(i=>i.nome+' ('+fmt(i.carbs,1)+' g)').join(', '))}</div>`:''}
  <label>Insulinas aplicadas (UI)</label>
  ${S.insulinas.filter(i=>i.ativa||dv(i.id)).map(i=>`<div class="setrow"><div class="t"><span class="dot" style="background:${i.cor}"></span> ${esc(i.nome)}${!id&&i.tipo==='basal'?`<div class="sm mut">fixa: ${esc(Object.entries(i.fixas||{}).filter(([,v])=>num(v)>0).map(([k,v])=>(ref(k)?.nome||k)+' '+fmt(v)).join(' · ')||'—')}</div>`:''}</div><input data-ins="${i.id}" inputmode="decimal" value="${dv(i.id)}" placeholder="UI"></div>`).join('')}
  <label>Observações</label><div class="tagsel" id="eTags">${TAGS.map(t=>`<button class="chip ${(r.tags||[]).includes(t)?'on':''}" onclick="this.classList.toggle('on')">${t}</button>`).join('')}</div>
  <textarea id="eN" rows="2" style="margin-top:8px" placeholder="Anotação">${esc(r.nota||'')}</textarea>
  <div class="row" style="margin-top:12px">${id?`<button class="btn danger" onclick="excluirRegistro('${id}')">Excluir</button>`:''}<button class="btn pri" style="flex:2" onclick="salvarRegistro(${id?`'${id}'`:'null'})">Salvar</button></div>`);
  window._eid=id;sugEdit();
  setTimeout(()=>{const t=modo==='ins'?$('#modal input[data-ins]'):(modo==='glic'?$('#eG'):null);if(t)t.focus();},150);}
function sugEdit(){const g=num($('#eG').value),c=num($('#eC').value),el=$('#eSug');if(!el)return;
  if(isNaN(g)&&isNaN(c)){el.style.display='none';return;}const R=calcular({glic:g,carbs:c,refId:$('#eRef').value,ts:fromLocalInput($('#eTs').value),excluir:window._eid});const bi=bolusCalc();el.style.display='block';
  el.className='alert '+(R.bloqueado?(R.semConfig?'warn':'low'):'info');
  el.innerHTML=R.semConfig?'Configure a fórmula em Ajustes para ver a dose sugerida.':R.bloqueado?'Glicemia baixa — não aplicar insulina; trate a hipoglicemia.':`Sugestão pela sua fórmula: <b>${fmt(R.arred,1)} UI</b> de ${esc(bi?bi.nome:'insulina rápida')} <span class="mut">(X ${fmtF(R.x,2)} + Y ${fmtF(R.y,2)})</span>${bi?` <button class="btn sm" onclick="const i=$('#modal input[data-ins=${bi.id}]');if(i)i.value='${fmt(R.arred,1)}'">Usar</button>`:''}`;}
function salvarRegistro(id){const g=num($('#eG').value),c=num($('#eC').value);
  const doses=$$('#modal input[data-ins]').filter(i=>num(i.value)>0).map(i=>({ins:i.dataset.ins,ui:num(i.value),motivo:'manual'}));
  const tags=$$('#eTags .chip.on').map(b=>b.textContent),nota=$('#eN').value;
  if(isNaN(g)&&isNaN(c)&&!doses.length&&!nota&&!tags.length){toast('Nada para salvar');return;}
  let r;if(id){r=S.registros.find(x=>x.id===id);baixaEstoque(r,-1);}else{r={id:uid(),itens:[]};S.registros.push(r);}
  Object.assign(r,{ts:fromLocalInput($('#eTs').value),refeicao:$('#eRef').value,glic:isNaN(g)?null:g,carbs:isNaN(c)?null:c,doses,tags,nota});
  baixaEstoque(r,1);save();fecha();toast('Salvo ✓');
  if(!id&&r.glic>0&&r.glic<S.config.hipo)toast('Glicemia baixa: trate com '+S.config.hipoCarbs+' g de carboidrato rápido');
  render();}
function excluirRegistro(id){if(!confirm('Excluir este registro?'))return;const r=S.registros.find(x=>x.id===id);baixaEstoque(r,-1);
  S.registros=S.registros.filter(x=>x.id!==id);save();fecha();render();toast('Excluído');}

// ===================== HISTÓRICO =====================
let HP=7;
function rHist(){const c=S.config,desde=HP===1?(()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime();})():Date.now()-HP*864e5,st=stats(desde);
  const R=S.registros.filter(r=>r.ts>=desde).sort((a,b)=>b.ts-a.ts);
  let h=`<div class="chips" style="margin-bottom:10px">${[[1,'Hoje'],[7,'7 dias'],[14,'14 dias'],[30,'30 dias'],[90,'90 dias']].map(([v,t])=>`<button class="chip ${HP===v?'on':''}" onclick="HP=${v};rHist()">${t}</button>`).join('')}</div>`;
  h+=`<div class="card"><h3>Glicemias</h3>${chart(desde,HP===1?desde+864e5:Date.now())}</div>`;
  if(st.n){const dias=Math.max(1,Math.min(HP,(Date.now()-Math.min(...R.map(r=>r.ts)))/864e5));
    const tot={};R.forEach(r=>(r.doses||[]).forEach(d=>tot[d.ins]=(tot[d.ins]||0)+d.ui));const cb=R.reduce((a,r)=>a+(r.carbs||0),0);
    h+=`<div class="card"><h3>Resumo</h3><div class="grid3">
      <div class="stat"><div class="v">${fmt(st.media,0)}</div><div class="l">média</div></div>
      <div class="stat"><div class="v">${fmt(st.n,0)}</div><div class="l">medições</div></div>
      <div class="stat"><div class="v">${fmt(st.cv,0)}%</div><div class="l">variabilidade (CV)</div></div>
      <div class="stat"><div class="v">${fmt(st.min,0)}–${fmt(st.max,0)}</div><div class="l">mín–máx</div></div>
      <div class="stat"><div class="v">${fmtF(st.gmi,1)}%</div><div class="l">A1c estimada*</div></div>
      <div class="stat"><div class="v">${fmt(cb/dias,0)} g</div><div class="l">carbo/dia</div></div></div>
      <div style="display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px 0 6px">
        <div style="width:${st.low}%;background:var(--low)"></div><div style="width:${st.ok}%;background:var(--ok)"></div><div style="width:${st.hi}%;background:var(--warn)"></div><div style="width:${st.vhi}%;background:var(--bad)"></div></div>
      <div class="sm" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><span class="g-low">Baixa ${fmt(st.low,0)}%</span><span class="g-ok">Alvo ${fmt(st.ok,0)}%</span><span class="g-hi">Alta ${fmt(st.hi,0)}%</span><span class="g-vhi">≥${c.altoAlerta}: ${fmt(st.vhi,0)}%</span></div>
      <div class="sm" style="margin-top:10px">${Object.entries(tot).map(([k,v])=>`<div class="calcline"><span><span class="dot" style="background:${ins(k)?.cor||'#888'}"></span> ${esc(ins(k)?.nome||k)}</span><b>${fmt(v/dias,1)} UI/dia</b></div>`).join('')}</div>
      <div class="sm mut" style="margin-top:6px">*Estimativa (GMI) pela média das medições de ponta de dedo — é só uma referência, não substitui o exame de A1c.</div></div>`;
    h+=`<div class="card"><h3>Média por momento</h3><table class="rep"><tr><th>Momento</th><th>Média</th><th>Medições</th><th>Baixas</th></tr>${refsOrd().map(r=>{const g=R.filter(x=>x.refeicao===r.id&&x.glic>0).map(x=>x.glic);if(!g.length)return '';const m=g.reduce((a,b)=>a+b,0)/g.length;return `<tr><td>${esc(r.nome)}</td><td class="g-${classe(m)} b">${fmt(m,0)}</td><td>${g.length}</td><td>${g.filter(x=>x<c.hipo).length}</td></tr>`;}).join('')}</table></div>`;}
  h+=`<button class="btn pri full noprint" style="margin-bottom:8px;padding:14px;font-size:16px" onclick="abrirRelatorio()">📄 Relatório completo com gráficos</button><div class="grid2 noprint" style="margin-bottom:12px"><button class="btn sm" onclick="exportXLSX()">📊 Planilha Excel</button><button class="btn sm" onclick="compartilhar()">↗ Resumo em texto</button></div>`;
  h+='<div class="card"><h3>Registros</h3>';
  if(!R.length)h+='<div class="empty">Nenhum registro no período.</div>';
  let dia='';for(const r of R.slice(0,400)){const k=diaKey(r.ts);if(k!==dia){if(dia)h+='</div>';dia=k;h+=`<div class="dayh">${diaNome(r.ts)}</div><div class="list">`;}h+=linhaRegistro(r);}
  if(dia)h+='</div>';h+='</div>';
  $('#tab-hist').innerHTML=h;}
function baixar(nome,conteudo,tipo){const b=new Blob([conteudo],{type:tipo}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function exportCSV(){const I=S.insulinas,cols=['Data','Hora','Momento','Glicemia (mg/dL)','Carboidratos (g)',...I.map(i=>i.nome+' (UI)'),'Alimentos','Observações'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const L=[...S.registros].sort((a,b)=>a.ts-b.ts).map(r=>[new Date(r.ts).toLocaleDateString('pt-BR'),hora(r.ts),ref(r.refeicao)?.nome||'',r.glic||'',r.carbs?fmt(r.carbs,1):'',...I.map(i=>{const s=(r.doses||[]).filter(d=>d.ins===i.id).reduce((a,d)=>a+d.ui,0);return s?fmt(s,1):'';}),(r.itens||[]).map(i=>i.nome).join(', '),[...(r.tags||[]),r.nota].filter(Boolean).join(' | ')].map(q).join(';'));
  baixar('controlbetico-'+diaKey(Date.now())+'.csv','﻿'+[cols.map(q).join(';'),...L].join('\n'),'text/csv');}
function compartilhar(){const desde=Date.now()-HP*864e5,st=stats(desde);if(!st.n){toast('Sem dados no período');return;}
  let t=`ControlBético — resumo ${HP} dia(s)\nMédia: ${fmt(st.media,0)} mg/dL (${st.n} medições)\nNo alvo: ${fmt(st.ok,0)}% · Baixas: ${st.nLow} · Altas: ${fmt(st.hi+st.vhi,0)}%\nMín–máx: ${fmt(st.min,0)}–${fmt(st.max,0)}\n`;
  for(const r of refsOrd()){const g=leituras(desde).filter(x=>x.refeicao===r.id).map(x=>x.glic);if(g.length)t+=`${r.nome}: média ${fmt(g.reduce((a,b)=>a+b,0)/g.length,0)} (${g.length})\n`;}
  if(navigator.share)navigator.share({title:'Resumo glicemia',text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Resumo copiado'));else alert(t);}

  <div class="chips" style="margin-top:8px">${['','★','Meus alimentos',...new Set(baseFoods().map(f=>f.grupo))].map(g=>`<button class="chip ${g===AG?'on':''}" onclick="AG='${g}';rAlim()">${g===''?'Todos':g==='★'?'★ Favoritos':g}</button>`).join('')}</div>

function favorito(id,b){const i=S.favoritos.indexOf(id);i<0?S.favoritos.push(id):S.favoritos.splice(i,1);save();b.classList.toggle('on');}
function verAlimento(id){const f=foodById(id);modal(`<h2>${esc(f.nome)} ${xBtn}</h2><div class="sm mut">${esc(f.grupo)}</div>
  <div class="calcline"><span>1 ${esc(f.medida)}</span><b>${fmt(f.gMed)} ${f.un}</b></div>
  <div class="calcline"><span>Carboidrato na medida</span><b>${fmt(carbsDe(f,f.gMed),1)} g</b></div>
  <div class="calcline"><span>Carboidrato em 100 ${f.un}</span><b>${fmt(f.c100,1)} g</b></div>

function novoAlimento(doSeletor,editId){const f=editId?S.alimentos.find(a=>a.id===editId):{nome:'',medida:'porção',gMed:'',c100:'',un:'g'};

function salvaAlimento(doSel,editId){const nome=$('#nN').value.trim(),g=num($('#nG').value),c=num($('#nC').value);

function campo(k,t,sub,un=''){return `<div class="setrow"><div class="t">${t}${sub?`<div class="sm mut">${sub}</div>`:''}</div><input inputmode="decimal" value="${S.config[k]==null?'':fmt(S.config[k],2)}" placeholder="—" onchange="setCfg('${k}',this)">${un?`<span class="sm mut" style="width:46px">${un}</span>`:''}</div>`;}
const OPCIONAIS=['antecedencia','doseMax','limiarCorrecao','ric','fs','alvo'];
function setCfg(k,el){if(el.value.trim()===''&&OPCIONAIS.includes(k)){S.config[k]=null;save();toast('Salvo');return;}const v=num(el.value);if(isNaN(v)||v<0){toast('Valor inválido');el.value=S.config[k]==null?'':fmt(S.config[k],2);return;}
  if((k==='ric'||k==='fs')&&v===0){toast('Não pode ser zero');el.value=fmt(S.config[k],2);return;}S.config[k]=v;save();toast('Salvo');}
function selCfg(k,t,sub,ops){return `<div class="setrow"><div class="t">${t}${sub?`<div class="sm mut">${sub}</div>`:''}</div><select style="width:150px" onchange="S.config['${k}']=isNaN(Number(this.value))?this.value:Number(this.value);save();toast('Salvo')">${ops.map(([v,l])=>`<option value="${v}" ${String(S.config[k])===String(v)?'selected':''}>${l}</option>`).join('')}</select></div>`;}

function editRef(id,sk){const sg=sk!=null&&sk!==''?MOM_SUG[sk]:null;const r=id?ref(id):{id:null,nome:sg?sg[0]:'',inicio:sg?sg[1]:'12:00',medir:true,ric:null,fs:null,alvo:null};const v=x=>x===null||x===undefined?'':x;
  modal(`<h2>${id?'Editar':'Novo'} momento ${xBtn}</h2>${id?'':`<div class="sm mut">Sugestões (só preenchem o nome e o horário):</div><div class="chips" style="margin:6px 0">${MOM_SUG.map((m,k)=>`<button class="chip" onclick="editRef(null,${k})">${m[0]}</button>`).join('')}</div>`}<label>Nome</label><input id="rN" value="${esc(r.nome)}" placeholder="ex.: Lanche da tarde">
  <label>Começa a partir de</label><input id="rI" type="time" value="${r.inicio}"><div class="sm mut">O app escolhe o momento automaticamente pelo horário.</div>
  <div class="setrow"><div class="t">Lembrar de medir glicemia</div><label class="sw"><input id="rM" type="checkbox" ${r.medir?'checked':''}><span></span></label></div>
  <div class="sm b" style="margin-top:10px">Valores específicos (deixe vazio para usar o padrão)</div>
  <div class="grid3"><div><label>Relação</label><input id="rR" inputmode="decimal" value="${v(r.ric)}" placeholder="${S.config.ric}"></div><div><label>Sensib.</label><input id="rF" inputmode="decimal" value="${v(r.fs)}" placeholder="${S.config.fs}"></div><div><label>Alvo</label><input id="rA" inputmode="decimal" value="${v(r.alvo)}" placeholder="${S.config.alvo}"></div></div>
  <div class="row" style="margin-top:14px">${id?`<button class="btn danger" onclick="delRef('${id}')">Excluir</button>`:''}<button class="btn pri" style="flex:2" onclick="salvaRef(${id?`'${id}'`:'null'})">Salvar</button></div>`);}
function salvaRef(id){const n=$('#rN').value.trim();if(!n){toast('Informe o nome');return;}
  const o=x=>{const s=$(x).value.trim();if(s==='')return null;const v=num(s);return v>0?v:null;};
  const d={nome:n,inicio:$('#rI').value||'00:00',medir:$('#rM').checked,ric:o('#rR'),fs:o('#rF'),alvo:o('#rA')};
  if(id)Object.assign(ref(id),d);else S.refeicoes.push({id:'r'+uid(),...d});save();fecha();render();toast('Salvo');}
function delRef(id){if(!confirm('Excluir este momento? Os registros antigos continuam salvos.'))return;S.refeicoes=S.refeicoes.filter(r=>r.id!==id);save();fecha();render();}
function editIns(id,pk){const pr=pk!=null&&pk!==''?PRESETS[pk]:{};const i=id?ins(id):{id:null,nome:'',tipo:'bolus',cor:'#3b82f6',duracao:4,fixas:{},estoque:null,abertoEm:'',validadeDias:28,ativa:true,...pr};
  modal(`<h2>${id?'Editar':'Nova'} insulina ${xBtn}</h2>${id?'':`<div class="sm mut">Atalhos (só preenchem nome e tipo):</div><div class="chips" style="margin:6px 0">${PRESETS.map((p,k)=>`<button class="chip" onclick="editIns(null,${k})">${esc(p.nome)}</button>`).join('')}</div>`}<label>Nome</label><input id="iN" value="${esc(i.nome)}" placeholder="ex.: Lispro, Glargina…">
  <div class="grid2"><div><label>Tipo</label><select id="iT"><option value="bolus" ${i.tipo==='bolus'?'selected':''}>Rápida (calculadora)</option><option value="basal" ${i.tipo==='basal'?'selected':''}>Basal / dose fixa</option></select></div>

  <div class="setrow"><div class="t">UI restantes no frasco/caneta<div class="sm mut">frasco 10 ml U-100 = 1000 UI</div></div><input id="iE" inputmode="decimal" value="${i.estoque??''}"></div>

  <div class="setrow"><div class="t">Validade após aberto (dias)</div><input id="iV" inputmode="numeric" value="${i.validadeDias||28}"></div>
  <div class="setrow"><div class="t">Insulina em uso</div><label class="sw"><input id="iU" type="checkbox" ${i.ativa?'checked':''}><span></span></label></div>

function salvaIns(id){const n=$('#iN').value.trim();if(!n){toast('Informe o nome');return;}
  const fixas={};$$('#modal input[data-fx]').forEach(e=>{const v=num(e.value);if(v>0)fixas[e.dataset.fx]=v;});
  const e=$('#iE').value.trim();
  const d={nome:n,tipo:$('#iT').value,cor:$('#iC').value,duracao:num($('#iD').value)||4,fixas,estoque:e===''?null:num(e),abertoEm:$('#iA').value,validadeDias:num($('#iV').value)||28,ativa:$('#iU').checked};
  if(id)Object.assign(ins(id),d);else S.insulinas.push({id:'i'+uid(),...d});save();fecha();render();toast('Salvo');}
function delIns(id){if(S.registros.some(r=>(r.doses||[]).some(d=>d.ins===id))){if(!confirm('Esta insulina tem registros. Melhor marcar como “não está em uso”. Excluir mesmo assim? (os registros antigos ficam sem nome)'))return;}
  else if(!confirm('Excluir insulina?'))return;S.insulinas=S.insulinas.filter(i=>i.id!==id);save();fecha();render();}
function exportJSON(){baixar('controlbetico-backup-'+diaKey(Date.now())+'.json',JSON.stringify(S,null,1),'application/json');toast('Backup gerado');}
function importJSON(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);
  if(!o||!Array.isArray(o.registros)||!Array.isArray(o.insulinas))throw 0;
  if(!confirm(`Restaurar backup com ${o.registros.length} registros? Os dados atuais serão substituídos.`))return;
  S=migrate(o);S.rev=(lerGuardado()||{}).rev||0;save();aplicaTema();toast('Backup restaurado');render();}catch(e){alert('Arquivo de backup inválido.');}inp.value='';};rd.readAsText(f);}
function apagarTudo(){if(!confirm('Apagar TODOS os registros e configurações?'))return;if(!confirm('Tem certeza? Isso não pode ser desfeito (faça backup antes).'))return;
  const keep={conta:S.conta,seguranca:S.seguranca,drive:S.drive};S=defaults();Object.assign(S,keep);S.rev=(lerGuardado()||{}).rev||0;save();aplicaTema();go('inicio');toast('Dados apagados');}

// ===================== LEITURA DE RÓTULO (OCR no próprio aparelho) =====================
const OCR_V='5.1.1',OCR_CDN='https://cdn.jsdelivr.net/npm/';const ocrLoc=p=>new URL(p,location.href).href;
let _tessP=null,_ocrWorker=null,_ocrProg=null;
function carregaTess(){if(window.Tesseract)return Promise.resolve();if(_tessP)return _tessP;
  _tessP=new Promise((res,rej)=>{const s=document.createElement('script');s.src=window.OCR_LOCAL?ocrLoc('ocr/tesseract.min.js'):OCR_CDN+'tesseract.js@'+OCR_V+'/dist/tesseract.min.js';
    s.onload=res;s.onerror=()=>{_tessP=null;s.remove();rej(new Error('rede'));};document.head.appendChild(s);});return _tessP;}
async function workerOCR(){await carregaTess();if(_ocrWorker)return _ocrWorker;
  _ocrWorker=await Tesseract.createWorker('por',1,window.OCR_LOCAL?{workerPath:ocrLoc('ocr/worker.min.js'),corePath:ocrLoc('ocr/core'),langPath:ocrLoc('ocr/lang'),cacheMethod:'none',
    logger:m=>{if(_ocrProg)_ocrProg(m);}}:{workerPath:OCR_CDN+'tesseract.js@'+OCR_V+'/dist/worker.min.js',
    corePath:OCR_CDN+'tesseract.js-core@'+OCR_V,langPath:OCR_CDN+'@tesseract.js-data/por/4.0.0_best_int',
    logger:m=>{if(_ocrProg)_ocrProg(m);}});
  await _ocrWorker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});return _ocrWorker;}

// melhora a foto: tamanho bom para leitura, tons de cinza e contraste
function prepImagem(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const max=Math.max(img.naturalWidth,img.naturalHeight),esc=Math.min(2200/max,Math.max(1,1400/max));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*esc);c.height=Math.round(img.naturalHeight*esc);
    const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const d=x.getImageData(0,0,c.width,c.height),p=d.data,h=new Uint32Array(256);
    for(let i=0;i<p.length;i+=4){const g=(p[i]*0.299+p[i+1]*0.587+p[i+2]*0.114)|0;p[i]=g;h[g]++;}

// interpreta o texto da tabela nutricional (formato novo da ANVISA "100 g | porção" e formato antigo "por porção")
function parseRotulo(txt){
  const fix=s=>norm(s).replace(/(\d)\s*[oO]\b/g,'$10').replace(/\b[oO](?=[.,]\d)/g,'0').replace(/(\d)[lI](?=\d)/g,'$11');
  const L=String(txt||'').split(/\n+/).map(fix).filter(l=>l.trim());
  const T=L.join('\n'),R={porcao:null,un:'g',medida:'',cP:null,c100:null,fibra:null,acucar:null,conf:'baixa'};
  const nn=s=>Number(String(s).replace(',','.'));
  const pm=T.match(/porc[aoõ]+\w*\s*(?:de|:)?\s*(\d+(?:[.,]\d+)?)\s*(g|ml)\b\s*(?:\(([^)\n]{1,40})\))?/);
  if(pm){R.porcao=nn(pm[1]);R.un=pm[2];if(pm[3])R.medida=pm[3].trim().replace(/\s+/g,' ');}
  const nums=l=>{const o=[];l.replace(/\([^)]*\)/g,' ').replace(/(\d+(?:[.,]\d+)?)\s*(%)?/g,(m,v,pc)=>{if(!pc)o.push(nn(v));return m;});return o;};
  const acha=re=>{for(let i=0;i<L.length;i++)if(re.test(L[i])){let v=nums(L[i].replace(re,' '));if(!v.length&&L[i+1])v=nums(L[i+1]);return{i,v};}return null;};
  const cl=acha(/carboidrat\w*(\s*totais)?/);
  const antes=cl?L.slice(0,cl.i).join(' '):T;
  const tem100=/\b100\s*(g|ml)\b/.test(antes);
  // tenta casar "valor em 100" com "valor na porção"; corrige vírgula perdida pelo leitor (ex.: 1,2 lido como 12)
  const parear=v=>{if(!R.porcao||v.length<2)return null;let best=null;const alt=x=>Number.isInteger(x)&&x>=10?[[x,0],[x/10,1],[x/100,2]]:[[x,0]];
    for(let a=0;a<v.length;a++)for(let b=0;b<v.length;b++){if(a===b)continue;for(const [va,fa] of alt(v[a]))for(const [vb,fb] of alt(v[b])){if(va>100)continue;
      const ex=va*R.porcao/100,err=Math.abs(vb-ex)/Math.max(ex,0.5);const pen=err+(fa+fb)*0.05+(a>b?0.02:0);
      if(err<0.2&&(!best||pen<best.pen))best={c100:va,cP:vb,pen,fix:fa+fb>0};}}return best;};
  if(cl&&cl.v.length){const v=cl.v.filter(x=>x<=1000);const pr=parear(v);
    if(pr){R.c100=pr.c100;R.cP=pr.cP;R.conf=pr.fix?'media':'alta';}
    else if(v.length>=2&&tem100&&R.porcao){R.c100=v[0];R.cP=v[1];R.conf='baixa';}
    else if(v.length){if(tem100&&(!R.porcao||R.porcao===100))R.c100=v[0];else R.cP=v[0];R.conf=R.porcao?'media':'baixa';}}
  if(R.porcao){if(R.c100!=null&&R.cP==null)R.cP=R.c100*R.porcao/100;if(R.cP!=null&&R.c100==null)R.c100=R.cP/R.porcao*100;}
  const pega=re=>{const r=acha(re);if(!r||!r.v.length)return null;if(tem100&&R.porcao){const pr=parear(r.v);return pr?pr.cP:null;}return r.v[0];};
  R.fibra=pega(/fibra\w*/);R.acucar=pega(/acucar\w*\s*(totais)?/);
  R.texto=L.join('\n');return R;}

async function lerRotulo(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;const st=$('#ocrSt');

  finally{_ocrProg=null;}}

async function iniciaScan(){const st=$('#scSt'),v=$('#scVid');
  try{_scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:false});v.srcObject=_scan.stream;await v.play();}
  catch(e){st.innerHTML='Não consegui abrir a câmera aqui. Digite o código abaixo.';return;}
  if('BarcodeDetector' in window){try{const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});st.textContent='Procurando o código…';
      _scan.timer=setInterval(async()=>{if(!_scan.stream)return;try{const r=await det.detect(v);if(r&&r.length){const c=r[0].rawValue;pararScan();achouCodigo(c);}}catch(e){}},250);return;}catch(e){}}
  try{st.textContent='Preparando o leitor…';await carregaZX();st.textContent='Procurando o código…';const rd=new ZXingBrowser.BrowserMultiFormatReader();
    _scan.zx=await rd.decodeFromVideoElement(v,(res)=>{if(res&&_scan.stream){const c=res.getText();pararScan();achouCodigo(c);}});}
  catch(e){st.innerHTML='Não consegui iniciar o leitor (precisa de internet na primeira vez). Digite o código abaixo.';}}
async function achouCodigo(cod){cod=String(cod).replace(/\D/g,'');pararScan();
  const local=S.alimentos.find(a=>a.codigo===cod);if(local){fecha();toast('Produto já cadastrado: '+local.nome);if(TAB==='calc'&&D)addFood(local.id);else verAlimento(local.id);return;}
  modal(`<h2>🏷️ ${esc(cod)} ${xBtn}</h2><div class="empty">🔎 Buscando o produto na base aberta…</div>`);
  try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${cod}?fields=code,product_name,product_name_pt,generic_name_pt,brands,quantity,serving_size,serving_quantity,nutriments,image_front_small_url&lc=pt`);
    const d=await r.json();const p=d&&d.status===1?d.product:null;const nu=p&&p.nutriments||{};
    const c100=nu.carbohydrates_100g!=null?Number(nu.carbohydrates_100g):null,cs=nu.carbohydrates_serving!=null?Number(nu.carbohydrates_serving):null;
    if(!p||(c100==null&&cs==null)){naoAchou(cod,p);return;}
    const sq=Number(p.serving_quantity)>0?Number(p.serving_quantity):null,ml=/ml|\bl\b|litro/i.test((p.serving_size||'')+' '+(p.quantity||''));
    const porc=sq||100,carb=cs!=null&&sq?cs:(c100!=null?c100*porc/100:cs);
    const nome=[p.product_name_pt||p.product_name||p.generic_name_pt||'',p.brands?p.brands.split(',')[0].trim():''].filter(Boolean).join(' — ')||('Produto '+cod);
    novoAlimento(TAB==='calc');$('#nN').value=nome;$('#nG').value=fmt(porc,1);$('#nU').value=ml?'ml':'g';$('#nC').value=fmt(carb,1);
    $('#nM').value=p.serving_size?String(p.serving_size).slice(0,40):(fmt(porc,1)+(ml?' ml':' g'));$('#nCod').value=cod;
    ['#nN','#nG','#nC','#nM'].forEach(s=>$(s).style.outline='2px solid var(--warn)');
    $('#ocrSt').innerHTML=`<div class="alert info" style="margin:6px 0">${p.image_front_small_url?`<img src="${esc(p.image_front_small_url)}" style="float:right;max-height:64px;max-width:64px;border-radius:8px;margin-left:8px">`:''}✓ Encontrei na base aberta <b>Open Food Facts</b>: ${c100!=null?`<b>${fmt(c100,1)} g</b> de carboidrato em 100 ${ml?'ml':'g'}`:''}${sq?` · porção de ${fmt(sq,1)} ${ml?'ml':'g'}`:''}.<br>Os dados são colaborativos — confira com o rótulo e salve.</div>`;}
  catch(e){naoAchou(cod,null,true);}}
function naoAchou(cod,p,rede){modal(`<h2>🏷️ ${esc(cod)} ${xBtn}</h2><div class="alert warn">${rede?'Sem internet para consultar o código agora.':`Esse produto ainda não tem os carboidratos na base aberta${p&&p.product_name?` (<b>${esc(p.product_name)}</b>)`:''}.`}<br>Tire uma foto da tabela nutricional — eu leio e já deixo o código guardado: da próxima vez que escanear, ele aparece na hora.</div>
