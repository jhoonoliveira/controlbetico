name: Gerar APK ControlBético
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: gerar-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.ver.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Versão
        id: ver
        run: |
          V="1.0.${GITHUB_RUN_NUMBER}"
          echo "versao=$V" >> $GITHUB_OUTPUT
          echo "VERSAO=$V" >> $GITHUB_ENV
      - run: npm ci --no-audit --no-fund
      - name: Preparar arquivos (OCR, leitor, ícones)
        run: |
          npm run bundle && node scripts/prepara.cjs
          NATIVO=$(cat nativo.txt | tr -d ' \n')
          echo "NATIVO=$NATIVO" >> $GITHUB_ENV
          echo "window.CBVER={versao:'${VERSAO}',nativo:${NATIVO}};" > www/versao.js
          cat www/versao.js
      - name: Pacote de atualização automática
        run: |
          (cd www && zip -qr -9 ../bundle.zip .)
          ls -la bundle.zip
          R="https://github.com/${GITHUB_REPOSITORY}/releases"
          SHA=$(sha256sum bundle.zip | cut -d' ' -f1)
          printf '{"versao":"%s","nativo":%s,"zip":"%s/download/v%s/bundle.zip","sha256":"%s","apk":"%s/latest/download/ControlBetico.apk"}\n' "$VERSAO" "$NATIVO" "$R" "$VERSAO" "$SHA" "$R" > atualizacao.json
          cat atualizacao.json
      - name: Criar projeto Android
        run: |
          npx cap add android
          mkdir -p android/app/src/main/java/com/controlbetico/app
          cp android-src/MainActivity.java android/app/src/main/java/com/controlbetico/app/MainActivity.java
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' $M
          grep -n "permission" $M
          ST=android/app/src/main/res/values/styles.xml
          sed -i 's#<style name="AppTheme.NoActionBar" parent="\([^"]*\)">#<style name="AppTheme.NoActionBar" parent="\1">\n        <item name="android:statusBarColor">\#0F1115</item>\n        <item name="android:navigationBarColor">\#181B22</item>#' $ST
          cat $ST
          G=android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"${VERSAO}\"/" $G
          grep -n "versionCode\|versionName" $G
      - name: Ícones e tela de abertura
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1d4ed8' --iconBackgroundColorDark '#1d4ed8' --splashBackgroundColor '#1d4ed8' --splashBackgroundColorDark '#0f1115'
      - run: npx cap sync android
      - name: Compilar
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Assinar
        env:
          CHAVE_BASE64: ${{ secrets.CHAVE_BASE64 }}
          SENHA_CHAVE: ${{ secrets.SENHA_CHAVE }}
        run: |
          printf '%s' "$CHAVE_BASE64" | tr -d ' \r\n' | base64 -d > chave.keystore
          echo "chave: $(wc -c < chave.keystore) bytes, sha256 $(sha256sum chave.keystore | cut -c1-12)"; echo "senha: ${#SENHA_CHAVE} caracteres"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$IN" alinhado.apk
          $BT/apksigner sign --ks chave.keystore --ks-key-alias controlbetico --ks-pass env:SENHA_CHAVE --key-pass env:SENHA_CHAVE --out ControlBetico.apk alinhado.apk
          $BT/apksigner verify --print-certs ControlBetico.apk | grep -i "SHA-1"
          rm chave.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: ControlBetico-apk
          path: |
            ControlBetico.apk
            bundle.zip
            atualizacao.json
  teste:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts }
      - uses: actions/download-artifact@v4
        with: { name: ControlBetico-apk }
      - run: cp scripts/teste.sh .
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Testar no emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r ControlBetico.apk
            adb logcat -c
            adb shell monkey -p com.controlbetico.app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > tela1-login.png
            bash teste.sh "Usar sem conta Google" tela2-sem-conta.png
            bash teste.sh "OK" tela3-confirmou.png
            bash teste.sh "Agora não" tela4-inicio.png
            bash teste.sh "Ajustes" tela5-ajustes.png
            bash teste.sh "Atualizações" tela6-atualizacoes.png
            adb shell input swipe 540 1300 540 450 600
            sleep 4
            adb exec-out screencap -p > tela6b-rolou.png
            bash teste.sh "Testar leitor de rótulo" tela7-teste-leitor.png 50
            adb logcat -d > logcat.txt
            adb shell pidof com.controlbetico.app && echo "APP_RODANDO=sim" > resultado.txt || echo "APP_RODANDO=nao" > resultado.txt
            grep -c "FATAL EXCEPTION" logcat.txt >> resultado.txt || true
            grep -i "Console\|chromium" logcat.txt | grep -i "error\|uncaught" | head -50 > erros-js.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste-emulador
          path: |
            *.png
            passos.txt
            logcat.txt
            resultado.txt
            erros-js.txt
      - name: Resultado do teste
        if: always()
        run: |
          cat resultado.txt passos.txt || true
          echo '--- erros JS ---'; cat erros-js.txt || true
          echo '--- leitor de rótulo ---'; grep -a "CB_OCR" logcat.txt | sed 's/.*Msg: //' | tee ocr.txt || true
          grep -q "Leitor OK" ocr.txt && echo "LEITOR=ok" || echo "LEITOR=falhou"
          echo '--- console do app ---'; grep -E "Capacitor|chromium|AndroidRuntime" logcat.txt | tail -120 || true
      - name: Guardar telas no ramo testes
        if: always()
        run: |
          mkdir pub && cp *.png resultado.txt passos.txt ocr.txt pub/ 2>/dev/null; cd pub
          git init -q -b testes && git config user.name "teste-bot" && git config user.email "bot@users.noreply.github.com"
          git add . && git commit -qm "telas do teste ${GITHUB_RUN_NUMBER}" && git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" testes
  publicar:
    needs: [build, teste]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: ControlBetico-apk }
      - name: Publicar versão
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release create "v${{ needs.build.outputs.versao }}" ControlBetico.apk bundle.zip atualizacao.json --repo "$GITHUB_REPOSITORY" --title "ControlBético ${{ needs.build.outputs.versao }}" --notes "APK gerado automaticamente."
  teste-atualizacao:
    needs: [build, publicar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts }
      - name: Baixar a versão anterior (se ela já tiver atualização automática)
        id: ant
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cp scripts/teste.sh .
          ANT=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 5 --json tagName -q '.[].tagName' | grep -v "v${{ needs.build.outputs.versao }}$" | head -1)
          echo "anterior=$ANT"
          if [ -n "$ANT" ] && gh release download "$ANT" --repo "$GITHUB_REPOSITORY" -p atualizacao.json -p ControlBetico.apk && [ -f atualizacao.json ]; then echo "ok=sim" >> $GITHUB_OUTPUT; else echo "ok=nao" >> $GITHUB_OUTPUT; echo "Versão anterior sem atualização automática — pulando."; fi
      - name: Habilitar KVM
        if: steps.ant.outputs.ok == 'sim'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Instalar a versão anterior e ver se ela se atualiza sozinha
        if: steps.ant.outputs.ok == 'sim'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r ControlBetico.apk
            adb logcat -c
            adb shell monkey -p com.controlbetico.app -c android.intent.category.LAUNCHER 1
            sleep 75
            adb shell input keyevent KEYCODE_HOME
            sleep 10
            adb shell am force-stop com.controlbetico.app
            sleep 3
            adb shell monkey -p com.controlbetico.app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > ota-depois.png
            adb logcat -d > logcat-ota.txt
            grep -a "CB_VERSAO=\|CB_UPD" logcat-ota.txt | sed 's/.*Msg: //' > ota.txt || true
            grep -a "CapgoUpdater: 🔴" logcat-ota.txt | head -20 >> ota.txt || true
            ls -la ota.txt
      - name: Conferir
        if: steps.ant.outputs.ok == 'sim'
        run: |
          cat ota.txt
          grep -q "versão ${{ needs.build.outputs.versao }}\|CB_VERSAO=${{ needs.build.outputs.versao }} " ota.txt && echo "ATUALIZOU_SOZINHO=sim" | tee -a ota.txt || { echo "ATUALIZOU_SOZINHO=nao" | tee -a ota.txt; exit 1; }
      - name: Guardar resultado no ramo testes
        if: always() && steps.ant.outputs.ok == 'sim'
        run: |
          U="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}"
          git clone -q --depth 1 -b testes "$U" t || { mkdir -p t && git -C t init -q -b testes && git -C t remote add origin "$U"; }
          mkdir -p t/ota && cp ota.txt ota-depois.png t/ota/ 2>/dev/null || true
          cd t && git config user.name "teste-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -qm "teste de atualização ${GITHUB_RUN_NUMBER}" && git push -q origin HEAD:testes || true
